  <text x="74" y="496" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">화석연료 54%는 천연가스 38%와 석탄 15%의 합 — 하버드 연구 중앙 시나리오, 지역 전력망 발전 믹스 귀속 기준</text>
