<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">첨단 패키징에 몰리는 돈</text>
  <g font-size="16" fill="#1a1a1a">
    <text x="40" y="105">첨단 패키징 설비투자 (2026년 전망)</text>
    <rect x="40" y="118" width="560" height="34" rx="6" fill="#16756a"/>
    <text x="612" y="141" font-weight="bold">약 280억 달러</text>
    <text x="40" y="205">AMD의 대만 반도체 투자 (파트너십 포함)</text>
    <rect x="40" y="218" width="200" height="34" rx="6" fill="#e0795b"/>
    <text x="252" y="241" font-weight="bold">100억 달러 이상</text>
    <text x="40" y="305">파워테크-브로드컴 합작 투자 (싱가포르)</text>
    <rect x="40" y="318" width="16" height="34" rx="6" fill="#62655d"/>
    <text x="68" y="341" font-weight="bold">4억 달러 — 2028년 생산 목표</text>
  </g>
  <g font-size="14" fill="#555555">
    <text x="400" y="392" text-anchor="middle">설비투자·기업 투자·합작 투자라 성격이 다르다 — 규모 감각용으로만 읽을 것</text>
  </g>
</svg>
