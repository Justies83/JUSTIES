<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#20231f">11월 9일 업데이트 — 용의자 병원서 사망, 동기는 미확인</text>
  <text x="70" y="158" font-size="18" font-weight="bold" fill="#20231f">사망</text>
  <rect x="170" y="128" width="336" height="44" fill="#e0795b"/>
  <text x="518" y="158" font-size="20" font-weight="bold" fill="#20231f">9명</text>
  <text x="170" y="206" font-size="15" fill="#20231f">광장 6명 + 자택 3명 (용의자 본인은 별도, 월요일 새벽 사망)</text>
  <text x="70" y="268" font-size="18" font-weight="bold" fill="#20231f">입원</text>
  <rect x="170" y="238" width="560" height="44" fill="#16756a"/>
  <text x="742" y="268" font-size="20" font-weight="bold" fill="#20231f">15명</text>
  <text x="170" y="316" font-size="15" fill="#20231f">부상자 15명 입원 중 — 14명 안정, 경찰관 1명 중태</text>
  <line x1="70" y1="360" x2="830" y2="360" stroke="#62655d" stroke-width="1"/>
  <text x="450" y="404" text-anchor="middle" font-size="17" fill="#20231f">용의자 <tspan font-weight="bold">미하우 옥신스키(24)</tspan>, 세 차례 수술 뒤 월요일 새벽 4시 30분 사망</text>
  <text x="450" y="438" text-anchor="middle" font-size="14" fill="#62655d">검찰 "특정 이념과 연결할 증거 없다" · 정부는 총기 허가 제도 재검토</text>
  <text x="450" y="490" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: 로이터·CNN·AFP (2026.11.09)</text>
</svg>
