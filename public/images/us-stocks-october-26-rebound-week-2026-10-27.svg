<text x="30" y="200" font-size="13" fill="#555555">연준은 동결이 널리 예상되나, CME 페드워치 기준 12월 인상 확률은 80%로 집계됐다.</text>
<text x="30" y="224" font-size="13" fill="#555555">트럼프 방한은 29일 시작 예정으로 보도됐으나, 정상회의 본회의 참석 여부는 확정되지 않았다.</text>
<text x="30" y="256" font-size="12" fill="#777777">출처: 뉴스핌 2026.10.27 · 이 블로그 10월 27일 삼성·SK하이닉스 글 · KBS 월드 2026.10.26</text>
