<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="10월 8일 뉴욕증시 마감 도표. 다우존스는 0.1퍼센트 올라 51231.64, S&amp;P500은 0.5퍼센트 내려 7765.36, 나스닥은 1.3퍼센트 내려 27193.34로 마감했다. 주간 기준 S&amp;P500 0.6퍼센트, 다우 0.1퍼센트 상승, 나스닥은 보합권이었다. 연초 대비로는 S&amp;P500 13.4퍼센트, 나스닥 17퍼센트, 다우 6.6퍼센트 올랐다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">NEW YORK CLOSE — OCT 8</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">기술주 약세에 나스닥 1.3% 빠졌다</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">다우는 보합권 상승, S&amp;P500도 동반 하락</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="144" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">당일 등락률 (%)</text>

  <line x1="450" y1="160" x2="450" y2="256" stroke="rgba(32,35,31,.18)"/>

  <text x="60" y="178" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">다우존스</text>
  <rect x="450" y="166" width="27" height="18" fill="#16756a" opacity="0.7"/>
  <text x="485" y="179" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#16756a">+0.1% (51,231.64)</text>

  <text x="60" y="210" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">S&amp;P500</text>
  <rect x="317" y="198" width="133" height="18" fill="#e0795b" opacity="0.6"/>
  <text x="60" y="226" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#e0795b">-0.5% (7,765.36)</text>

  <text x="60" y="246" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">나스닥</text>
  <rect x="103" y="234" width="347" height="18" fill="#e0795b" opacity="0.6"/>
  <text x="60" y="262" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#e0795b">-1.3% (27,193.34)</text>

  <line x1="60" y1="286" x2="840" y2="286" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="310" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">주간 등락률 — 나스닥만 보합권</text>

  <rect x="60" y="322" width="780" height="34" fill="#62655d" opacity="0.08"/>
  <text x="76" y="345" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">S&amp;P500 +0.6% · 다우 +0.1% · 나스닥 +0.1% 미만</text>

  <line x1="60" y1="372" x2="840" y2="372" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="396" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">연초 대비 누적 등락률</text>

  <rect x="60" y="408" width="780" height="76" fill="#16756a" opacity="0.14"/>
  <text x="76" y="432" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">S&amp;P500 +13.4% · 나스닥 +17% · 다우 +6.6%</text>
  <text x="76" y="454" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">하루 조정만으로 연간 상승 흐름이 꺾였다고 보기는 이름</text>
  <text x="76" y="474" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">대형 기술주 약세가 S&amp;P500 내 상승 종목 대다수를 덮음</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 AP(La Nación 게재) 보도로 직접 작성</text>
</svg>
