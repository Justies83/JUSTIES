  <text x="74" y="80" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">엔비디아 실적부터 앤트로픽 상장까지, 나흘 연속 시험대</text>

  <line x1="110" y1="260" x2="790" y2="260" stroke="#16756a" stroke-width="3" stroke-linecap="round"/>

