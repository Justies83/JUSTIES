<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#0b1020"/>
<text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">스위프트가 남긴 숫자</text>
<text x="40" y="68" font-family="sans-serif" font-size="14" fill="#9aa7c7">막대 길이는 수치의 상대 크기를 대략적으로 보여줄 뿐, 정확한 비율은 아니다</text>
<text x="40" y="120" font-family="sans-serif" font-size="16" fill="#e2e8f0">감마선 폭발</text>
<rect x="220" y="102" width="420" height="22" fill="#3b82f6"/><text x="650" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2,000건 이상</text>
<text x="40" y="170" font-family="sans-serif" font-size="16" fill="#e2e8f0">초신성 폭발</text>
<rect x="220" y="152" width="300" height="22" fill="#22c55e"/><text x="530" y="170" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1,400건 이상</text>
<text x="40" y="220" font-family="sans-serif" font-size="16" fill="#e2e8f0">관련 논문</text>
<rect x="220" y="202" width="560" height="22" fill="#f59e0b"/><text x="790" y="220" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">약 7,000편</text>
<text x="40" y="270" font-family="sans-serif" font-size="16" fill="#e2e8f0">자외선·광학 이미지</text>
<rect x="220" y="252" width="620" height="22" fill="#a78bfa"/><text x="40" y="300" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">150만 장 이상 · 공개 자료 약 12TB (고화질 영화 약 600편 분량)</text>
<text x="40" y="340" font-family="sans-serif" font-size="13" fill="#94a3b8">출처: NASA 스위프트 임무 종료 발표(2026.10.23) · 서울신문(2026.10.25)</text>
</svg>
