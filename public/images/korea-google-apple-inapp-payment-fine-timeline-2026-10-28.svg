<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">인앱결제 강제 제재, 5년의 경과</text>
  <line x1="70" y1="150" x2="930" y2="150" stroke="#888888" stroke-width="2"/>
  <circle cx="110" cy="150" r="10" fill="#1a73e8"/>
  <circle cx="310" cy="150" r="10" fill="#1a73e8"/>
  <circle cx="510" cy="150" r="10" fill="#1a73e8"/>
  <circle cx="710" cy="150" r="10" fill="#1a73e8"/>
  <circle cx="900" cy="150" r="10" fill="#d93025"/>
  <text x="110" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2021년 9월</text>
  <text x="110" y="200" text-anchor="middle" font-size="15" fill="#333333">인앱결제 강제 금지법</text>
  <text x="110" y="222" text-anchor="middle" font-size="15" fill="#333333">세계 최초 시행</text>
  <text x="310" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2022년 8월</text>
