<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="이란이 주장하는 미 무인기 격추 수와 미 감사관 집계 — MQ-9 리퍼 이란 주장 56대, MQ-1 이란 주장 16대, MQ-9 미 국방부 감사관 보고서(2월 28일~6월 30일) 최대 30대">
  <rect x="0" y="0" width="900" height="520" fill="#f4f1ea"/>
  <text x="40" y="52" font-family="sans-serif" font-size="27" font-weight="bold" fill="#20231f">이란이 주장하는 미 무인기 격추 수와 미 감사관 집계</text>
  <text x="40" y="118" font-family="sans-serif" font-size="21" fill="#20231f">MQ-9 리퍼 — 이란 주장</text>
  <rect x="40" y="132" width="560" height="46" fill="#e0795b"/>
  <text x="614" y="164" font-family="sans-serif" font-size="22" font-weight="bold" fill="#20231f">56대</text>
  <text x="40" y="238" font-family="sans-serif" font-size="21" fill="#20231f">MQ-1 — 이란 주장</text>
  <rect x="40" y="252" width="160" height="46" fill="#e0795b"/>
  <text x="214" y="284" font-family="sans-serif" font-size="22" font-weight="bold" fill="#20231f">16대</text>
  <text x="40" y="358" font-family="sans-serif" font-size="21" fill="#20231f">MQ-9 — 미 국방부 감사관 보고서 (2월 28일~6월 30일)</text>
  <rect x="40" y="372" width="300" height="46" fill="#16756a"/>
  <text x="354" y="404" font-family="sans-serif" font-size="22" font-weight="bold" fill="#20231f">최대 30대</text>
  <text x="40" y="472" font-family="monospace" font-size="15" fill="#62655d">이란 집계는 미확인 주장이다. 감사관 수치는 지상에서 파괴된 기체를 포함한다.</text>
  <text x="40" y="498" font-family="monospace" font-size="15" fill="#62655d">출처: 테헤란타임스·사일런트도시어 2026년 11월 13일 보도.</text>
