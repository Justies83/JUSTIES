<text x="380" y="204" font-size="16" font-weight="bold" fill="#222">56%</text>
<text x="40" y="300" font-size="14" fill="#666">완전 반응 15%와 부분 반응 28%의 합이 반올림 때문에 43%로 보이지만,</text>
<text x="40" y="324" font-size="14" fill="#666">발표된 전체 반응률은 42%다 (95% 신뢰구간 32~52%). 반응 지속 기간 1.4개월 이상~19.7개월 이상.</text>
