<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#f7f5f0"/>
  <text x="600" y="44" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">도핑이 늘어날수록 두 곡선이 함께 내려간다 (개념도)</text>
  <line x1="140" y1="380" x2="1080" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="80" x2="140" y2="380" stroke="#333" stroke-width="2"/>
  <text x="610" y="425" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#333">세륨 도핑 x 증가 → (0.116에서 0.188로)</text>
  <text x="60" y="230" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#333" transform="rotate(-90 60 230)">상대 크기</text>
  <path d="M 160 130 Q 500 170 1060 360" fill="none" stroke="#2f5f8f" stroke-width="4"/>
  <path d="M 160 110 Q 500 200 1060 350" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="160" cy="130" r="7" fill="#2f5f8f"/>
  <circle cx="1060" cy="360" r="7" fill="#2f5f8f"/>
  <circle cx="160" cy="110" r="7" fill="#c0392b"/>
  <circle cx="1060" cy="350" r="7" fill="#c0392b"/>
  <text x="180" y="100" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">온도에 비례하는 산란 성분 (스핀 요동 산란)</text>
  <text x="180" y="155" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2f5f8f">초전도 임계온도 Tc</text>
  <text x="160" y="405" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333">x 0.116 (최적 도핑 부근)</text>
  <text x="1060" y="405" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333">x 0.188 (초전도 돔 끝)</text>
  <text x="600" y="455" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#777">논문은 온도에 비례하는 비등방성 산란 성분이 도핑 구간 전체에서 약 10분의 1 수준으로 떨어진다고 보고했습니다. 곡선은 경향을 보여주는 개념도입니다.</text>
</svg>
