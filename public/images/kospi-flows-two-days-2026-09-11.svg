  <text x="683" y="378" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#e0795b">+1.87</text>

  <line x1="60" y1="436" x2="840" y2="436" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="462" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">9.11 코스피 6,909.91(-1.76%) · 장중 저점은 개장가 6,802.50</text>
  <text x="60" y="484" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 머니투데이 보도 수치로 직접 작성</text>
</svg>
