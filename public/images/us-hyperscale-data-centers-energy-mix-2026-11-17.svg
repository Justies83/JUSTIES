  <text x="74" y="72" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">403곳 초대형 데이터센터의 전력원 — 화석연료가 절반 넘는다</text>

  <line x1="250" y1="110" x2="250" y2="410" stroke="rgba(32,35,31,.16)"/>
