<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="삼성전자 SK하이닉스 하락 요인 도표. 9월 28일 오후 삼성전자는 4.82퍼센트, SK하이닉스는 장중 한때 4.94퍼센트까지 내렸다. 배당 마지막 매수일 매물 출회, 외국인 9천억원 기관 2천억원 순매도, 국채금리 상승과 필라델피아 반도체지수 하락, 35조원 자사주 매입 종료 임박이 겹쳤다. 같은 날 아침에는 3분기 합산 영업이익 190조원 컨센서스가 나왔다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">SEP 28 — RECORD Q3, RED DAY</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">실적 전망 190조원 나온 날, 주가는 4%대 빠졌습니다</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">9월 28일 오후 1시52분 기준 등락률</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="80" y="164" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">삼성전자</text>
  <rect x="220" y="150" width="289" height="22" fill="#e0795b" opacity="0.75"/>
  <text x="519" y="167" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#e0795b">-4.82% (27만1,750원)</text>

  <text x="80" y="204" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">SK하이닉스</text>
  <rect x="220" y="190" width="296" height="22" fill="#16756a" opacity="0.6"/>
  <text x="526" y="207" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#16756a">장중 한때 -4.94%</text>

  <line x1="60" y1="232" x2="840" y2="232" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="256" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">왜 겹쳤나 — 네 가지 요인</text>

  <rect x="60" y="268" width="380" height="60" fill="#62655d" opacity="0.1"/>
  <text x="76" y="290" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">① 배당 마지막 매수일</text>
  <text x="76" y="310" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">자격 확보 직후 매물 출회 — 흔한 패턴</text>

  <rect x="460" y="268" width="380" height="60" fill="#62655d" opacity="0.1"/>
  <text x="476" y="290" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">② 외국인·기관 순매도</text>
  <text x="476" y="310" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">외국인 9,000억 · 기관 2,000억</text>

  <rect x="60" y="336" width="380" height="60" fill="#62655d" opacity="0.1"/>
  <text x="76" y="358" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">③ 연휴 중 해외 변수</text>
  <text x="76" y="378" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">美 10년물 5.2% · 필라델피아반도체 2일간 -2%</text>

  <rect x="460" y="336" width="380" height="60" fill="#62655d" opacity="0.1"/>
  <text x="476" y="358" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">④ 자사주 매입 종료 임박</text>
  <text x="476" y="378" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">35조원 규모, 다음 달 중순 마무리 전망</text>

  <line x1="60" y1="412" x2="840" y2="412" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="436" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">같은 날, 엇갈린 시간축</text>
  <rect x="60" y="448" width="780" height="46" fill="#16756a" opacity="0.12"/>
  <text x="76" y="470" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">오전: 3분기 합산 영업이익 컨센서스 190조원 (7~9월 결과 반영)</text>
  <text x="76" y="488" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">오후: 배당락·금리·수급이라는 당장의 변수에 주가는 반대로 반응</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 서울신문·이투데이 보도로 직접 작성</text>
</svg>
