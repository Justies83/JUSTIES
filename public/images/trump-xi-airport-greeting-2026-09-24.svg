<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="트럼프-시진핑 정상회담 의전 도표. 9월 23일 오후 6시(한국시간 24일 오전 7시) 트럼프 대통령이 앤드루스합동기지에서 시진핑 주석을 직접 영접한다. 24일 백악관 환영식에는 B-2 폭격기 1대와 F-22 4대가 동원되는데, 이는 2025년 8월 푸틴 방미 때와 같은 급이며 그 전 무함마드 빈 살만 왕세자 방문 때 F-35만 동원된 것보다 높은 수준이다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">TRUMP-XI SUMMIT — SEP 24</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">공항까지 나간 환대, 푸틴급 의전</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">최근 미국 국빈 방문 의전 수준 비교</text>

  <line x1="60" y1="132" x2="840" y2="132" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="156" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">국빈 방문 의전 비교 — 동원 전력</text>

  <rect x="60" y="168" width="380" height="56" fill="#62655d" opacity="0.12"/>
  <text x="76" y="192" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">무함마드 빈 살만 왕세자</text>
  <text x="76" y="212" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#62655d">F-35 축하비행</text>

  <rect x="460" y="168" width="380" height="56" fill="#e0795b" opacity="0.18"/>
  <text x="476" y="192" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">푸틴 대통령 (2025.8)</text>
  <text x="476" y="212" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#e0795b">B-2 · F-22 · F-35 총동원</text>

  <rect x="260" y="236" width="380" height="56" fill="#16756a" opacity="0.18"/>
  <text x="276" y="260" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">시진핑 주석 (9.24, 이번)</text>
  <text x="276" y="280" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#16756a">B-2 1대 + F-22 4대 — 푸틴급</text>

  <line x1="60" y1="308" x2="840" y2="308" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="332" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">가장 이례적인 대목</text>
  <rect x="60" y="344" width="780" height="52" fill="#e0795b" opacity="0.15"/>
  <text x="76" y="368" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">트럼프 대통령이 백악관이 아닌 앤드루스합동기지로 직접 영접</text>
  <text x="76" y="390" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">공화당 소속 상원의원도 이 의전을 비판</text>

  <line x1="60" y1="412" x2="840" y2="412" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="436" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">일정 — 9.23 저녁(현지) ~ 9.25</text>
  <text x="76" y="458" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">9.23 오후 6시(한국 24일 오전 7시) — 앤드루스기지 영접</text>
  <text x="76" y="478" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">9.24 — 백악관 환영식·정상회담·이스트룸 국빈 만찬</text>
  <text x="76" y="498" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">9.25 — 다과회·스미스소니언·국립문서기록관리청 방문 후 귀국</text>

  <text x="60" y="512" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 파이낸셜뉴스 보도로 직접 작성</text>
</svg>
