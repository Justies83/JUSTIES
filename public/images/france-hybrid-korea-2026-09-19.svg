<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="프랑스 방어령 도표. 마크롱 대통령이 러시아의 하이브리드 공격 강화를 이유로 에너지·방산 시설 방어령을 발령했다. 근거는 독일 라이프치히 공항 드론 공격, 우크라이나-폴란드 국경 야호딘 열차 드론 공격, 이탈리아부터 에스토니아까지 방산 시설 화재다. 폴란드 브로츠와프의 LG에너지솔루션, 현대로템, 한화에어로스페이스 등 유럽 진출 한국 기업도 보안을 강화하고 있다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">FRANCE — SEP 19</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">프랑스의 방어령, 유럽 전역을 근거로 들었다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">방어령의 근거가 된 최근 사례와 유럽 진출 한국 기업의 대응</text>

  <line x1="60" y1="132" x2="840" y2="132" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="156" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">마크롱 대통령이 든 근거 — 발트해에서 지중해까지</text>

  <g font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5">
    <circle cx="70" cy="182" r="5" fill="#e0795b"/>
    <text x="92" y="187" fill="#20231f">독일 라이프치히 공항 — 폭발물 드론 공격 (독일 정부, 러시아 소행으로 공식 지목)</text>

    <circle cx="70" cy="210" r="5" fill="#e0795b"/>
    <text x="92" y="215" fill="#20231f">우크라이나-폴란드 국경 야호딘 — 여객 열차 드론 공격</text>

    <circle cx="70" cy="238" r="5" fill="#e0795b"/>
    <text x="92" y="243" fill="#20231f">이탈리아~에스토니아 — 주요 방산 시설 의심스러운 화재</text>
  </g>

  <rect x="60" y="258" width="780" height="40" fill="#e0795b" opacity="0.15"/>
  <text x="76" y="283" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">→ 프랑스, 에너지·방산 시설 방어령 발령 + 정부에 보호 계획 수립 지시</text>

  <line x1="60" y1="314" x2="840" y2="314" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="338" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">유럽 진출 한국 기업의 대응</text>

  <g font-family="'IBM Plex Sans KR',sans-serif" font-size="14">
    <text x="60" y="366" fill="#20231f">LG에너지솔루션</text>
    <text x="230" y="366" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#20231f">폴란드 브로츠와프(유럽 최대 거점) 전력망·사이버 보안 강화</text>

    <text x="60" y="394" fill="#20231f">현대로템 · 한화에어로</text>
    <text x="270" y="394" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#20231f">현지 공장·수송로 보안 통제 강화</text>
  </g>

  <line x1="60" y1="420" x2="840" y2="420" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="432" width="780" height="40" fill="#16756a" opacity="0.14"/>
  <text x="76" y="457" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">방산·배터리·에너지 인프라 전반의 유지 관리 비용 증가 예상</text>

  <text x="60" y="490" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 글로벌이코노믹·UPI 보도와 이 아카이브의 기존 기록으로 직접 작성</text>
</svg>
