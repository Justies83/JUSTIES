<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="호르무즈 11월 7일 업데이트">
<rect width="800" height="440" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 7일 업데이트 — 금요일 공습과 2일 브리지 딜</text>
<line x1="60" y1="80" x2="60" y2="380" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">금요일 공습 · 케슘섬 수자 지역 2차례 폭발</text><text x="84" y="120" fill="#cfe3ef" font-size="15">트럼프 "사소한 공격" · 새로 설치된 대공시설 15분 만에 제거</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">중간선거 이후 첫 공습 · 월요일 방어 공습 이후 두 번째</text><text x="84" y="180" fill="#cfe3ef" font-size="15">목요일엔 "이란 나머지 파괴" 발언도 · 이란 MQ-9 격추 주장</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">브리지 딜 1일차 · 미국 봉쇄 해제·동결 자금 일부 해제</text><text x="84" y="240" fill="#cfe3ef" font-size="15">대가로 이란, 폭격당한 핵 시설에 IAEA 사찰 허용</text>
<circle cx="60" cy="280" r="8" fill="#f2b705"/><text x="84" y="276" fill="#ffffff" font-size="17" font-weight="700">브리지 딜 2일차 · 이란 호르무즈 재개 (이란-오만 수정 합의, 임시)</text><text x="84" y="300" fill="#cfe3ef" font-size="15">이후 60% 농축 우라늄 440.9kg 등 본격 협상</text>
<circle cx="60" cy="340" r="8" fill="#f2b705"/><text x="84" y="336" fill="#ffffff" font-size="17" font-weight="700">압박 병행 · CENTCOM 핵 정보 현상금 2천만 달러</text><text x="84" y="360" fill="#cfe3ef" font-size="15">국무부 10개국 미국인 보안 경보 · 카타르 "협상 결렬 보도 거짓"</text>
<text x="40" y="420" fill="#8fb3c7" font-size="13">출처: AP·알자지라 11월 7일 보도</text>
</svg>
