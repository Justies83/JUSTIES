  <rect x="60" y="432" width="780" height="60" fill="#e0795b" opacity="0.13"/>
  <text x="76" y="456" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">키움증권 시나리오: 환율 1,450원 → 1,350원 가정 시</text>
  <text x="76" y="478" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#e0795b">삼성전자 전망치 111조원 → 105조5,000억원으로 하향</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">숫자는 확정치가 아닌 9월 컨센서스 · 도표는 파이낸셜뉴스·뉴스스페이스 보도로 직접 작성</text>
