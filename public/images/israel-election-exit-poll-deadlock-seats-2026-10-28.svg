<text x="200" y="315" font-size="14" fill="#c0392b">과반 기준 61석 — 어느 진영도 도달하지 못함</text>
<text x="40" y="315" font-size="13" fill="#777">출처: JPost·USA TODAY 2026.10.27 출구조사 정리</text>
