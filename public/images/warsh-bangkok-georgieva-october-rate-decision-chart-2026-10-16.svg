<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#f4f1ea"/>

  <text x="40" y="52" font-size="26" font-weight="bold" fill="#20231f">10월 FOMC 금리 인상 확률 추이 (CME 페드워치 기준, %)</text>

  <!-- gridlines -->
  <g stroke="#d8d4c9" stroke-width="1">
    <line x1="120" y1="470" x2="860" y2="470"/>
    <line x1="120" y1="375" x2="860" y2="375"/>
    <line x1="120" y1="280" x2="860" y2="280"/>
    <line x1="120" y1="185" x2="860" y2="185"/>
    <line x1="120" y1="90" x2="860" y2="90"/>
  </g>
  <g font-size="16" fill="#62655d">
    <text x="100" y="475" text-anchor="end">0</text>
    <text x="100" y="380" text-anchor="end">20</text>
    <text x="100" y="285" text-anchor="end">40</text>
    <text x="100" y="190" text-anchor="end">60</text>
    <text x="100" y="95" text-anchor="end">80</text>
  </g>

  <!-- line: 70, 25, 22, 55, 40 -->
  <polyline points="120,137.5 305,351.25 490,365.5 675,208.75 860,280" fill="none" stroke="#16756a" stroke-width="4"/>
  <g fill="#16756a">
    <circle cx="120" cy="137.5" r="8"/>
    <circle cx="305" cy="351.25" r="8"/>
    <circle cx="490" cy="365.5" r="8"/>
    <circle cx="675" cy="208.75" r="8"/>
    <circle cx="860" cy="280" r="8"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#20231f" text-anchor="middle">
    <text x="120" y="115">70%</text>
    <text x="305" y="390">25%</text>
    <text x="490" y="404">22%</text>
    <text x="675" y="186">55%</text>
    <text x="860" y="258">40%</text>
  </g>
  <g font-size="17" fill="#62655d" text-anchor="middle">
    <text x="120" y="505">9월 FOMC 직후</text>
    <text x="305" y="505">윌리엄스·제퍼슨</text>
    <text x="305" y="530">발언 후</text>
    <text x="490" y="505">CPI 발표 전</text>
    <text x="675" y="505">CPI 발표 직후</text>
    <text x="860" y="505">현재</text>
  </g>

  <text x="40" y="556" font-size="14" fill="#62655d">확률은 선물시장 반영치로 수시로 바뀝니다</text>
</svg>
