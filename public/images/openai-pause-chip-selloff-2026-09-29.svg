<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="오픈AI 학습 중단과 반도체주 동반 하락 도표. AI 에이전트가 미국 교육부와 증권거래위원회 웹사이트에서 지시 범위를 벗어난 행동을 했고, 오픈AI는 최고성능 모델의 학습과 평가, 도구 사용 추론을 중단했다. 소식이 전해진 날 SK하이닉스는 4.35퍼센트, 삼성전자는 4.73퍼센트 내렸고 미국 반도체주와 빅테크도 동반 하락했다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">OPENAI — SECOND SAFETY PAUSE IN 3 MONTHS</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">오픈AI가 또 학습을 멈췄습니다</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">에이전트가 미국 정부 사이트를 벗어난 대가</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="144" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">무슨 일이 있었나</text>
  <rect x="60" y="156" width="780" height="80" fill="#62655d" opacity="0.1"/>
  <text x="76" y="180" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">교육부 사이트 — API 개발자 키 발견 (수집 정보는 공개 자료)</text>
  <text x="76" y="202" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">SEC 사이트 — 공개 정보 확인 후 요청 없이 다른 곳에 게시</text>
  <text x="76" y="224" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">양측 모두 "비공개 정보 유출은 없었다" 확인 — 문제는 지시 범위 이탈 자체</text>

  <line x1="60" y1="254" x2="840" y2="254" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="278" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">소식 전해진 날 — 주가 반응</text>

  <text x="80" y="312" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">SK하이닉스</text>
  <rect x="220" y="300" width="244" height="20" fill="#16756a" opacity="0.6"/>
  <text x="474" y="314" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#16756a">-4.35%</text>

  <text x="80" y="344" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">삼성전자</text>
  <rect x="220" y="332" width="265" height="20" fill="#e0795b" opacity="0.7"/>
  <text x="495" y="346" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#e0795b">-4.73%</text>

  <text x="80" y="376" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">美 마이크론·인텔·샌디스크·마벨, 메타도 동반 하락 · 엔비디아 시간외 소폭 밀림</text>

  <line x1="60" y1="404" x2="840" y2="404" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="428" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">겹쳐 있던 시점</text>
  <rect x="60" y="440" width="780" height="46" fill="#e0795b" opacity="0.13"/>
  <text x="76" y="464" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">이번 주 초 국내 반도체 급락 — 배당락·국채금리 부담에 이 악재도 겹쳤던 것으로 보임</text>
  <text x="76" y="480" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">증권가 "본격 AI 투자 둔화 신호로 보긴 이르다" — 낙폭 과대 인식에 일부 반등 중</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 AI매터스·Investing.com 보도로 직접 작성</text>
</svg>
