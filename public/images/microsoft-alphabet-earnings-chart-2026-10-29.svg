<text x="60" y="512" font-size="13" font-family="monospace" fill="#62655d">출처: 양사 실적 발표 및 2026년 10월 28일 보도 정리. 마이크로소프트 설비투자는 현금 기준, 알파벳은 분기 설비투자 기준.</text>
