<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="2026년 9월 10일 미국 반도체주 하락률 도표. 인텔 5.6퍼센트, SK하이닉스 ADR 5.2퍼센트, 마이크론 4.9퍼센트 내렸고 필라델피아 반도체지수는 2.66퍼센트 내렸다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">SEMIS — SEP 10</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">지수보다 개별 종목이 두 배 더 빠졌다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">9월 10일 종가 기준 하락률 (%)</text>

  <line x1="300" y1="160" x2="300" y2="392" stroke="rgba(32,35,31,.16)" stroke-width="1.5"/>

  <!-- 인텔 -5.6 -->
  <text x="285" y="196" text-anchor="end" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#20231f">인텔</text>
  <rect x="300" y="178" width="336" height="26" fill="#e0795b"/>
  <text x="648" y="196" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#e0795b">-5.60</text>

  <!-- SK하이닉스 ADR -5.2 -->
  <text x="285" y="250" text-anchor="end" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#20231f">SK하이닉스 ADR</text>
  <rect x="300" y="232" width="312" height="26" fill="#e0795b" opacity="0.92"/>
  <text x="624" y="250" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#e0795b">-5.20</text>

  <!-- 마이크론 -4.9 -->
  <text x="285" y="304" text-anchor="end" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#20231f">마이크론</text>
  <rect x="300" y="286" width="294" height="26" fill="#e0795b" opacity="0.84"/>
  <text x="606" y="304" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#e0795b">-4.90</text>

  <!-- 필라델피아 반도체지수 -2.66 -->
  <text x="285" y="358" text-anchor="end" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#20231f">필라델피아 반도체지수</text>
  <rect x="300" y="340" width="160" height="26" fill="#62655d" opacity="0.55"/>
  <text x="472" y="358" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#62655d">-2.66</text>

  <line x1="60" y1="430" x2="840" y2="430" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="458" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">배경: 브렌트유 107.63달러(+6.34%) · 미 10년물 4.95%(+11bp)</text>
  <text x="60" y="480" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 라디오서울 보도 수치로 직접 작성</text>
</svg>
