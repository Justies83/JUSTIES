<text x="450" y="380" text-anchor="middle" font-size="16" fill="#62655d" font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>도표는 트레이딩키(2026.10.21)·프리말레이시아투데이(2026.10.20) 보도 수치를 인용해 직접 작성했습니다.</text>
