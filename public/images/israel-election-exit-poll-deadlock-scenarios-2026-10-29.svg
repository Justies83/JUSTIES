<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="이스라엘 총선 이후 시나리오">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111">개표 이후, 정부를 만드는 네 갈래</text>
  <text x="400" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">과반 61석 · 개표율 93.1% 기준 · 최종 결과 아님</text>
  <g font-family="sans-serif" font-size="15" fill="#111111">
    <rect x="40" y="75" width="720" height="44" rx="8" fill="#eef3fb"/>
    <text x="60" y="103">1 · 네타냐후 진영 53석 — 과반까지 8석 부족</text>
    <rect x="40" y="129" width="720" height="44" rx="8" fill="#fdf3e7"/>
    <text x="60" y="157">2 · 야권 48석 + 아랍 정당 19석 = 67석 — 협력 장벽이 변수</text>
    <rect x="40" y="183" width="720" height="44" rx="8" fill="#eef7ee"/>
    <text x="60" y="211">3 · 네타냐후 주도 통합정부 — 분석가들이 가장 유력하게 평가</text>
    <rect x="40" y="237" width="720" height="44" rx="8" fill="#fbeef0"/>
    <text x="60" y="265">4 · 재선거 — 헤르조그 대통령은 회피 의사 표명</text>
  </g>
</svg>
