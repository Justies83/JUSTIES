  <text x="824" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="#16756a">100점</text>

  <text x="74" y="332" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#20231f">응시자 평균</text>
  <rect x="210" y="296" width="181" height="64" fill="#e0795b" rx="3"/>
