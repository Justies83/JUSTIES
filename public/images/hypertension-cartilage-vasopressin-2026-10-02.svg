<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="고혈압과 퇴행성관절염 연결고리 도표. 전남대 류제황, 인제대 전장수 교수 공동 연구팀이 사이언스에 발표했다. 고혈압 상태에서 늘어난 뇌 호르몬 바소프레신이 노화·손상된 연골에 늘어난 수용체 AVPR1A와 결합하면 연골 분해 신호는 강해지고 유지 신호는 약해진다. 동물실험에서 AVPR1A를 제거하거나 약물 렐코밥탄을 투여하자 연골 손상이 크게 줄었다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">SCIENCE — JNU &amp; INJE UNIV, OCT 2</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">고혈압이 무릎 연골을 갉아먹는 이유</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">뇌 호르몬 바소프레신이 관절까지 이동한다</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="138" width="360" height="96" fill="#62655d" opacity="0.1"/>
  <text x="76" y="162" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">건강한 연골</text>
  <text x="76" y="186" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">수용체 AVPR1A 거의 없음</text>
  <text x="76" y="206" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">바소프레신이 있어도 결합할 곳이 없음</text>
  <text x="76" y="224" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#62655d">연골 분해·유지 신호 균형 유지</text>

  <rect x="480" y="138" width="360" height="96" fill="#e0795b" opacity="0.15"/>
  <text x="496" y="162" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">노화·손상된 연골 + 고혈압</text>
  <text x="496" y="186" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">수용체 AVPR1A 크게 증가</text>
  <text x="496" y="206" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">혈중 바소프레신 농도도 높아짐</text>
  <text x="496" y="224" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#e0795b">AVP + AVPR1A 결합 급증</text>

  <line x1="60" y1="256" x2="840" y2="256" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="280" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">결합 이후 — 신호가 한쪽으로 기운다</text>

  <text x="80" y="314" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">연골 분해 신호</text>
  <rect x="230" y="302" width="296" height="20" fill="#e0795b" opacity="0.65"/>
  <text x="536" y="316" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#e0795b">강해짐</text>

  <text x="80" y="346" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">연골 유지 신호</text>
  <rect x="230" y="334" width="90" height="20" fill="#16756a" opacity="0.5"/>
  <text x="330" y="348" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#16756a">약해짐</text>

  <line x1="60" y1="380" x2="840" y2="380" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="392" width="780" height="100" fill="#16756a" opacity="0.13"/>
  <text x="76" y="416" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">동물실험 — 신호를 끊으면 손상이 줄었다</text>
  <text x="76" y="440" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#62655d">AVPR1A 수용체 제거 → 고혈압성 연골 손상 크게 감소</text>
  <text x="76" y="460" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#62655d">약물 렐코밥탄(AVPR1A 차단제) 투여 → 비슷한 억제 효과 확인</text>
  <text x="76" y="480" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">사람 대상 안전성·효능 검증은 앞으로의 과제</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 파이낸셜뉴스·헤럴드경제·데일리안 보도로 직접 작성</text>
</svg>
