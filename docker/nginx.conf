server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro builds directories, so /posts/foo must resolve to /posts/foo/index.html.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Hashed assets are safe to cache forever; HTML must not be.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # Cloudflare Pages control files; meaningless here and not worth serving.
  location ~ ^/_(headers|redirects)$ { return 404; }

  # The editing screen: never cached, never indexed.
  location /admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Served as text/plain by default, which the CMS refuses to parse.
  location = /admin/config.yml {
    default_type text/yaml;
    add_header Cache-Control "no-store" always;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/rss+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
