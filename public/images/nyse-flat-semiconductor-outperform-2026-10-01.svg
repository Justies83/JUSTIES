<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="9월 29일 뉴욕증시 도표. 다우 S&amp;P500 나스닥 3대 지수는 0.3퍼센트 안쪽 약세로 마감했지만 반도체 관련주는 강세를 보였다. ASML 3.56퍼센트, 램리서치 2.99퍼센트, SK하이닉스 ADR 2.62퍼센트, 필라델피아반도체지수 1.32퍼센트 올랐다. 반면 엔비디아는 0.72퍼센트 내렸다.">
