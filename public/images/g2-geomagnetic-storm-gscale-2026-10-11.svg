<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="NOAA 지자기 폭풍 G 등급표">
<rect width="900" height="520" fill="#f4f1ea"/>
<text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#20231f" font-family="sans-serif">NOAA 지자기 폭풍 등급 (G-scale) — 이번 주말 예보는 G2</text>
<rect x="150" y="80" width="140" height="52" rx="6" fill="#16756a" opacity="0.55"/>
