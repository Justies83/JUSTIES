<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="마이크론 4분기 실적 도표. 매출 542억3천만달러로 사상 최고, 시장 예상치 510억7천만달러를 넘었다. 조정 EPS는 33.42달러로 공식 컨센서스 31.61달러를 웃돌았지만 위스퍼 넘버 34에서 35달러에는 못 미쳤다. 시간외 주가는 0.69퍼센트 하락했다. 1분기 가이던스는 매출 615억달러, EPS 38.15달러로 월가 전망을 크게 웃돈다.">
