<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="sans-serif">
<rect width="900" height="460" fill="#fafafa"/>
<text x="40" y="40" font-size="22" font-weight="bold" fill="#111">무라수 정식 명명 — 11월 1일 오후 업데이트</text>
<text x="40" y="68" font-size="14" fill="#555">오전 특보가 자정쯤으로 봤던 명명이 11월 1일 오전 11시 30분으로 앞당겨졌다.</text>
<text x="40" y="118" font-size="15" fill="#333">10월 31일 오전 11시 30분 — 열대저기압으로 발달</text>
<text x="40" y="148" font-size="15" fill="#333">11월 1일 오전 5시 30분 — 깊은 저기압 (첸나이 동남동쪽 약 700km)</text>
<text x="40" y="178" font-size="17" font-weight="bold" fill="#c0392b">11월 1일 오전 11시 30분 — 사이클론 무라수 명명</text>
<text x="40" y="208" font-size="15" fill="#333">명명 당시 위치: 북위 12.1도, 동경 85.3도 / 첸나이 동남동쪽 약 560km</text>
<text x="40" y="258" font-size="17" font-weight="bold" fill="#1f4e79">앞으로의 예보</text>
<text x="40" y="288" font-size="15" fill="#333">11월 2일 — 강한 사이클론 단계로 발달 예보</text>
<text x="40" y="318" font-size="15" fill="#333">11월 2일 밤에서 11월 3일 이른 아침 — 넬로르와 나르사푸르 사이 횡단</text>
<text x="40" y="348" font-size="15" fill="#333">횡단 당시 풍속 시속 100에서 110km, 돌풍 시속 120km</text>
<text x="40" y="398" font-size="15" fill="#333">오디샤 남부 대피 명령 / 안드라 해안 어업 11월 2일 아침부터 11월 4일 오후까지 제한</text>
<text x="40" y="428" font-size="14" fill="#555">출처: 인도 기상청 11월 1일 특보를 인용한 뉴 인디안 익스프레스, 뉴스미터, ETV 바라트 보도.</text>
</svg>
