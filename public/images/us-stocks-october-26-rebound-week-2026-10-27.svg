<circle cx="80" cy="80" r="9" fill="#2563eb"/><text x="80" y="112" text-anchor="middle" font-weight="bold">10월 27일</text><text x="80" y="134" text-anchor="middle">뉴욕증시 반등 보도</text><text x="80" y="154" text-anchor="middle">(뉴스핌)</text>
<circle cx="280" cy="80" r="9" fill="#dc2626"/><text x="280" y="112" text-anchor="middle" font-weight="bold">10월 28일</text><text x="280" y="134" text-anchor="middle">연준 금리 결정</text><text x="280" y="154" text-anchor="middle">SK하이닉스 실적</text>
<circle cx="480" cy="80" r="9" fill="#dc2626"/><text x="480" y="112" text-anchor="middle" font-weight="bold">10월 29일</text><text x="480" y="134" text-anchor="middle">ECB 금리 결정</text><text x="480" y="154" text-anchor="middle">삼성전자 실적</text>
