# Sveltia CMS — the browser editing screen at /admin.
#
# The form below writes exactly the front matter that src/content.config.ts
# validates. Change one and you must change the other.
#
# Three ways to sign in, all writing the same Markdown files:
#
#   1. "Sign In Using Access Token" — paste a GitHub fine-grained token scoped
#      to this repository. Nothing else to deploy. This is the default for a
#      single author.
#   2. "Work with Local Repository" — `npm run dev`, then pick the repo folder.
#      Edits land straight in src/content/posts/. No network, no GitHub.
#      This is the mode to use on the NAS.
#   3. "Sign In with GitHub" — one click instead of a pasted token, but it needs
#      an OAuth App and the proxy Worker in worker/. Uncomment base_url and
#      auth_endpoint below once that Worker is deployed.

backend:
  name: github
  repo: Justies83/JUSTIES
  branch: claude/personal-editable-homepage-31hofg
  # base_url: https://justies-cms-auth.justies.workers.dev
  # auth_endpoint: auth

# Lets the sign-in screen offer the local-repository option during `npm run dev`.
local_backend: true

media_folder: public/images
public_folder: /images

# Korean labels throughout; the values written to disk stay ASCII ids.
locale: ko

collections:
  - name: posts
    label: 기록
    label_singular: 기록
    folder: src/content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    preview_path: posts/{{filename}}
    summary: '{{title}} — {{category}} / {{kind}}'
    sortable_fields: [date, title, category]
    view_groups:
      - label: 주제
        field: category
      - label: 형식
        field: kind
    fields:
      - name: title
        label: 제목
        widget: string

      - name: date
        label: 작성일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false

      - name: category
        label: 주제
        widget: select
        default: research
        options:
          - { label: '연구 (Research)', value: research }
          - { label: '과학 (Science)', value: science }
          - { label: '국제 정세 (World)', value: world }
          - { label: '금융 · 산업 (Finance)', value: finance }
          - { label: 'IT 정보 (Tech)', value: tech }
          - { label: '일상 · 육아 (Life)', value: life }

      - name: kind
        label: 형식
        widget: select
        default: note
        options:
          - { label: '뉴스 — 읽고 남긴 소식', value: news }
          - { label: '의견 — 내 해석과 판단', value: opinion }
          - { label: '정보 — 두고 참고할 기록', value: note }

      - name: takeaway
        label: 한 줄 요약
        hint: 목록 카드와 검색 결과에 그대로 보입니다.
        widget: text

      - name: tags
        label: 태그
        widget: list
        required: false
        default: []

      - name: updated
        label: 갱신일
        hint: 내용을 고쳤을 때만 채웁니다.
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false

      - name: source
        label: 출처
        hint: 뉴스나 자료를 옮겨 적었을 때. 직접 쓴 글은 비워 둡니다.
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: 출처 이름, widget: string, required: false }
          - { name: url, label: 링크, widget: string, required: false }

      - name: cover
        label: 대표 이미지
        widget: image
        required: false
        choose_url: false

      - name: coverAlt
        label: 이미지 설명
        widget: string
        required: false
        default: ''

      - name: featured
        label: 홈 상단에 올리기
        widget: boolean
        default: false
        required: false

      - name: draft
        label: 초안 (배포된 사이트에서 숨김)
        widget: boolean
        default: false
        required: false

      - name: body
        label: 본문
        widget: markdown
