  <text x="370" y="76" text-anchor="middle" font-size="15" fill="#62655d">엔비디아 8억 달러 투자 (CNBC·FT)</text>
  <circle cx="610" cy="260" r="13" fill="#e0795b" stroke="#20231f" stroke-width="2"/>
