# Sveltia CMS — the browser editing screen at /admin.
#
# The form below writes exactly the front matter that src/content.config.ts
# validates. Change one and you must change the other.
#
# Three ways to sign in, all writing the same Markdown files:
#
#   1. "Sign In Using Access Token" — paste a GitHub fine-grained token scoped
#      to this repository. Nothing else to deploy. This is the default for a
#      single author.
#   2. "Work with Local Repository" — `npm run dev`, then pick the repo folder.
#      Edits land straight in src/content/posts/. No network, no GitHub.
#      This is the mode to use on the NAS.
#   3. "Sign In with GitHub" — no token to carry between machines. Backed by the
#      OAuth App and the proxy Worker in worker/, both deployed. Use this one on
#      a new PC or phone.

backend:
  name: github
  repo: Justies83/JUSTIES
  branch: claude/personal-editable-homepage-31hofg
  base_url: https://justies-cms-auth.justies.workers.dev
  auth_endpoint: auth

# Lets the sign-in screen offer the local-repository option during `npm run dev`.
local_backend: true

media_folder: public/images
public_folder: /images

# Korean labels throughout; the values written to disk stay ASCII ids.
locale: ko

collections:
  - name: posts
    label: 기록
    label_singular: 기록
    folder: src/content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    preview_path: posts/{{filename}}
    summary: '{{title}} — {{category}} / {{kind}}'
    sortable_fields: [date, title, category]
    view_groups:
      - label: 주제
        field: category
      - label: 형식
        field: kind
    fields:
      - name: title
        label: 제목
        widget: string

      - name: date
        label: 작성일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false

      - name: category
        label: 주제
        widget: select
        default: research
        options:
          - { label: '연구 — 논문 · 방법론', value: research }
          - { label: '과학 — 생명과학 · 브리핑', value: science }
          - { label: '경제 · 산업 — 시황 · 기업', value: finance }
          - { label: '국제 정세 — 외교 · 정책', value: world }
          - { label: 'IT · 기술 — 도구 · 소프트웨어', value: tech }
          - { label: '리뷰 · 소개 — 맛집 · 기기 · 장비', value: review }
          - { label: '육아 — 돌봄 · 성장', value: parenting }
          - { label: '일상 — 취미 · 관찰', value: life }

      - name: kind
        label: 형식
        widget: select
        default: note
        options:
          - { label: '뉴스 — 읽고 남긴 소식', value: news }
          - { label: '의견 — 내 해석과 판단', value: opinion }
          - { label: '정보 — 두고 참고할 기록', value: note }

      - name: takeaway
        label: 한 줄 요약
        hint: 목록 카드와 검색 결과에 그대로 보입니다.
        widget: text

      - name: tags
        label: 태그
        widget: list
        required: false
        default: []

      - name: updated
        label: 갱신일
        hint: 내용을 고쳤을 때만 채웁니다.
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false

      - name: source
        label: 출처
        hint: 뉴스나 자료를 옮겨 적었을 때. 직접 쓴 글은 비워 둡니다.
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: 출처 이름, widget: string, required: false }
          - { name: url, label: 링크, widget: string, required: false }

      - name: cover
        label: 대표 이미지
        widget: image
        required: false
        choose_url: false

      - name: coverAlt
        label: 이미지 설명
        widget: string
        required: false
        default: ''

      - name: gallery
        label: 사진 여러 장
        hint: 맛집 · 기기 리뷰처럼 사진이 여러 장인 글에서. 본문 아래 격자로 보입니다.
        widget: list
        required: false
        collapsed: false
        label_singular: 사진
        summary: '{{fields.caption}}'
        fields:
          - { name: image, label: 사진, widget: image }
          - { name: caption, label: 설명, widget: string, required: false, default: '' }

      - name: featured
        label: 홈 상단에 올리기
        widget: boolean
        default: false
        required: false

      - name: draft
        label: 초안 (배포된 사이트에서 숨김)
        widget: boolean
        default: false
        required: false

      - name: body
        label: 본문
        widget: markdown
        # The toolbar covers headings, lists, quotes, bold/italic/link and
        # inline images. Tables have no toolbar button, so keep the raw mode
        # available — a GFM table typed there renders correctly on the site.
        modes: [rich_text, raw]

  # A queue, not content. Files here are never published; the scheduled run
  # reads them, writes the post, and marks the request done. Kept in the repo so
  # a request is as portable as a post.
  - name: requests
    label: 글 요청
    label_singular: 요청
    folder: content/requests
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '[{{fields.상태}}] {{fields.주제}}'
    sortable_fields: [상태, 주제]
    view_groups:
      - label: 상태
        field: 상태
    fields:
      - name: 주제
        label: 무엇에 대해 쓸까요
        hint: 한 줄이면 됩니다. "8월 CPI 발표 정리", "요즘 쓰는 키보드 리뷰" 처럼.
        widget: string

      - name: 지시사항
        label: 덧붙일 말 (선택)
        hint: 강조할 점, 빼야 할 내용, 참고할 관점 등.
        widget: text
        required: false
        default: ''

      - name: 참고링크
        label: 참고 링크 (선택)
        hint: 근거로 쓸 기사나 자료 주소.
        widget: list
        required: false
        default: []

      - name: 섹션
        label: 섹션 (선택)
        hint: 비워 두면 주제에 맞게 알아서 고릅니다.
        widget: select
        required: false
        options:
          - { label: '(자동)', value: '' }
          - { label: '연구', value: research }
          - { label: '과학', value: science }
          - { label: '경제 · 산업', value: finance }
          - { label: '국제 정세', value: world }
          - { label: 'IT · 기술', value: tech }
          - { label: '리뷰 · 소개', value: review }
          - { label: '육아', value: parenting }
          - { label: '일상', value: life }
        default: ''

      - name: 형식
        label: 형식 (선택)
        widget: select
        required: false
        options:
          - { label: '(자동)', value: '' }
          - { label: '뉴스 — 읽고 남긴 소식', value: news }
          - { label: '의견 — 내 해석과 판단', value: opinion }
          - { label: '정보 — 두고 참고할 기록', value: note }
        default: ''

      - name: 초안으로만
        label: 초안으로만 저장 (검토 후 직접 발행)
        widget: boolean
        default: false
        required: false

      - name: 상태
        label: 상태
        widget: select
        options:
          - { label: '대기 — 아직 처리되지 않음', value: 대기 }
          - { label: '완료 — 글이 발행됨', value: 완료 }
          - { label: '취소', value: 취소 }
        default: 대기

      - name: 결과
        label: 결과 (자동 기록)
        hint: 처리 후 예약 실행이 글 주소를 적습니다. 비워 두세요.
        widget: string
        required: false
        default: ''
        # The toolbar covers headings, lists, quotes, bold/italic/link and
        # inline images. Tables have no toolbar button, so keep the raw mode
        # available — a GFM table typed there renders correctly on the site.
        modes: [rich_text, raw]
