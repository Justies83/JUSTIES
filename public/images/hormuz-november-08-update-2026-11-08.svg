<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="호르무즈 11월 8일 업데이트">
<rect width="800" height="440" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 8일 업데이트 — 일요일 유조선 3척 화재 주장</text>
<line x1="60" y1="80" x2="60" y2="380" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">일요일 주장 · 혁명수비대, 유조선 3척 기뢰 폭발 화재</text><text x="84" y="120" fill="#cfe3ef" font-size="15">비인가 항로·항법 장치 꺼진 배 — 선박명 미공개, 독립 확인 없음</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">UKMTO 확인 · 토요일 늦은 시간 사건 2건</text><text x="84" y="180" fill="#cfe3ef" font-size="15">카사브 앞바다 유조선 화재·선원 대피, 또 1척 미확인 투사체 피격</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">주간 집계 · 해협 8건·아라비아만 3건 확인</text><text x="84" y="240" fill="#cfe3ef" font-size="15">배 3척 침몰·5척 구조 — 해협 통항량 전쟁 전 20% 수준</text>
<circle cx="60" cy="280" r="8" fill="#f2b705"/><text x="84" y="276" fill="#ffffff" font-size="17" font-weight="700">육상 봉쇄 · 미 태스크포스 아이언 게이트 가동</text><text x="84" y="300" fill="#cfe3ef" font-size="15">쿠퍼 사령관 해상 봉쇄 성공 육지로 — 이란 250억 달러 수출 차단 주장</text>
<circle cx="60" cy="340" r="8" fill="#f2b705"/><text x="84" y="336" fill="#ffffff" font-size="17" font-weight="700">유가 · 브렌트 금요일 98.32달러 마감</text><text x="84" y="360" fill="#cfe3ef" font-size="15">전주 113.43달러에서 약 13% 하락 — 2020년 4월 이후 최대 주간 낙폭</text>
<text x="40" y="420" fill="#8fb3c7" font-size="13">출처: The National·AFP·CNBC 11월 8일 보도</text>
</svg>
