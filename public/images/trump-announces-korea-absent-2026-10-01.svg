<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="트럼프 대미투자 발표와 한국 반응 도표. 트럼프는 2000억달러 투자에 엔시날 가스발전 220억달러, 원전 8기 1200억달러, 알래스카 LNG 500억달러가 포함된다고 발표했다. 한국 정치인이나 정부 관계자는 발표 현장에 참석하지 않았다. 김정관 산업부 장관은 발표 8일 전 알래스카 프로젝트가 타당성이 없다고 말한 바 있다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">KOREA-US INVESTMENT — ANNOUNCED, UNRESOLVED</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">트럼프는 "확정", 한국은 "타당성 없다"</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">발표 현장에 한국은 없었습니다</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="144" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">트럼프의 9.30 백악관 발표 — 2,000억달러</text>
  <rect x="60" y="156" width="780" height="80" fill="#62655d" opacity="0.1"/>
  <text x="76" y="180" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">① 엔시날 가스발전 220억달러 — 양측 이견 없이 동의</text>
  <text x="76" y="202" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">② 대형 원전 8기 1,200억달러 — 지분 갈등 여전 (9.28 글)</text>
  <text x="76" y="224" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#e0795b">③ 알래스카 LNG 500억달러 — 한국은 아직 비동의</text>

  <line x1="60" y1="254" x2="840" y2="254" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="266" width="360" height="110" fill="#16756a" opacity="0.13"/>
  <text x="76" y="290" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">미국 측 입장</text>
  <text x="76" y="314" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#62655d">"확정" 발표 — 드디어 건설</text>
  <text x="76" y="334" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#62655d">알래스카 LNG 약 670억달러 거론</text>
  <text x="76" y="354" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">→ 한국의 2,000억달러 한도 초과</text>

  <rect x="480" y="266" width="360" height="110" fill="#e0795b" opacity="0.15"/>
  <text x="496" y="290" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">한국 측 입장 (김정관 장관, 9.22)</text>
  <text x="496" y="314" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">"우리 입장에서 할 타당성이 없다"</text>
  <text x="496" y="334" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">"상업적 합리성이 떨어지는 것은 사실"</text>
  <text x="496" y="354" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">"전략적 이익 있어도 비합리적이면 안 한다"</text>

  <line x1="60" y1="398" x2="840" y2="398" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">가장 눈에 띄는 장면</text>
  <rect x="60" y="434" width="780" height="46" fill="#62655d" opacity="0.1"/>
  <text x="76" y="458" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">수백조원 걸린 발표 현장에 한국 정치인·정부 관계자 아무도 불참</text>
  <text x="76" y="474" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">한국의 유보적 입장은 발표 8일 전부터 이미 공개돼 있었음</text>

  <text x="60" y="504" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 케이뉴스LA·뉴스핌·SBS Biz 보도로 직접 작성</text>
</svg>
