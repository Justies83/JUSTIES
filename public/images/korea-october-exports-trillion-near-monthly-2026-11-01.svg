<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="sans-serif">
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">2026년 월 수출과 1조달러까지의 거리</text>
  <g font-size="16" fill="#1a1a1a">
    <text x="200" y="84" text-anchor="end">9월 수출</text>
    <rect x="210" y="68" width="484" height="22" fill="#2471a3"/>
    <text x="704" y="84">1,209억달러</text>
    <text x="200" y="124" text-anchor="end">10월 수출</text>
    <rect x="210" y="108" width="461" height="22" fill="#2471a3"/>
    <text x="681" y="124">1,152.8억달러</text>
    <text x="200" y="164" text-anchor="end">1~10월 누적</text>
    <rect x="210" y="148" width="372" height="22" fill="#1e8449"/>
    <text x="592" y="164">9,300억달러</text>
    <text x="200" y="204" text-anchor="end">1조달러까지 남은 금액</text>
    <rect x="210" y="188" width="28" height="22" fill="#e67e22"/>
    <text x="248" y="204">700억달러</text>
  </g>
  <g font-size="14" fill="#555555">
    <text x="400" y="252" text-anchor="middle">누적 9,300억달러는 사상 첫 9,000억달러 돌파, 남은 700억달러는 최근 두 달 월평균의 60%에도 못 미친다</text>
    <text x="400" y="280" text-anchor="middle">산업통상부 2026년 10월 수출입동향 기준, 누적 수치는 발표된 반올림 수치</text>
  </g>
</svg>
