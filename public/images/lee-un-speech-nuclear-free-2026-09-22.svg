<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="이재명 대통령 유엔총회 연설 도표. 문재인 전 대통령은 완전한 비핵화를 명확히 주장했지만, 이재명 대통령은 비핵화 대신 핵 없는 한반도라는 표현으로 동결에서 축소를 거쳐 폐기로 가는 단계적 접근을 제시했다. 같은 날 북한 외교관은 트럼프 대통령의 연설은 본회의장에서 지켜봤지만 이재명 대통령의 연설 때는 자리를 비웠다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">UN GENERAL ASSEMBLY — SEP 22</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">단어는 바뀌었는데, 북한은 자리를 비웠다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">화법의 변화와 그 연설을 들은 쪽의 반응</text>

  <line x1="60" y1="132" x2="840" y2="132" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="156" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">유엔총회 연설 — 화법 비교</text>

  <rect x="60" y="168" width="380" height="72" fill="#62655d" opacity="0.12"/>
  <text x="76" y="192" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">문재인 (전임)</text>
  <text x="76" y="216" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">"완전한 비핵화"</text>
  <text x="76" y="234" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">즉각적·전면적 요구</text>

  <rect x="460" y="168" width="380" height="72" fill="#16756a" opacity="0.16"/>
  <text x="476" y="192" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">이재명 (9.22)</text>
  <text x="476" y="216" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#16756a">"핵 없는 한반도"</text>
  <text x="476" y="234" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#16756a">동결 → 축소 → 폐기, 단계적 접근</text>

  <line x1="60" y1="258" x2="840" y2="258" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="282" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">3대 평화공존 구상</text>
  <text x="76" y="306" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">① 서로를 존중하는 포용적 평화공존</text>
  <text x="76" y="328" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">② 싸울 필요가 없는 안정적 평화공존</text>
  <text x="76" y="350" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">③ 세계 평화에 기여하는 책임 있는 평화공존</text>

  <line x1="60" y1="372" x2="840" y2="372" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="396" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#e0795b">그날 본회의장 — 북한 외교관의 선택적 참석</text>

  <circle cx="100" cy="428" r="6" fill="#16756a"/>
  <text x="118" y="433" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">오전 — 트럼프 대통령 연설 → 북한 외교관 2명 본회의장에서 청취</text>

  <circle cx="100" cy="458" r="6" fill="#e0795b"/>
  <text x="118" y="463" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">오후 — 이재명 대통령 연설 → 북한 대표단 자리 비움 (지난해도 동일)</text>

  <text x="60" y="490" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">김성 주유엔 북한대사는 트럼프 연설에도 불참 · 배정 좌석도 이동한 상태</text>
  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 서울신문·파이낸셜뉴스·국민일보 보도로 직접 작성</text>
</svg>
