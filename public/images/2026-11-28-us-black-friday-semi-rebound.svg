<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <style>
      .bg { fill: #f8f7f4; }
      .panel { fill: #ffffff; stroke: #d8d4ca; stroke-width: 1.5; }
      .t-title { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #171717; }
      .t-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #57534e; letter-spacing: 1.1px; }
      .t-h { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 700; fill: #171717; }
      .t-b { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 12px; fill: #44403c; }
      .t-v { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; fill: #171717; }
      .grid { stroke: #ebe7de; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="880" height="460" />
  <text x="32" y="34" class="t-sub">US MARKET CLOSE · BLACK FRIDAY 2026.11.27 (EARLY CLOSE 13:00 ET)</text>
  <text x="32" y="60" class="t-title">미 증시 블랙프라이데이 반등 — 지수 마감 및 반도체·AI 핵심 종목 등락률 (%)</text>

  <!-- Left Panel: Indices -->
  <rect x="28" y="82" width="388" height="334" rx="12" class="panel" />
  <text x="48" y="110" class="t-h">A. 주요 지수 일간 등락률</text>
  <text x="48" y="128" class="t-b">S&amp;P 500·나스닥, 올해 4월 이후 최대 주간 상승</text>

  <line x1="52" y1="150" x2="52" y2="368" stroke="#a8a29e" stroke-width="1.2" />
  <line x1="164" y1="150" x2="164" y2="368" class="grid" />
  <line x1="276" y1="150" x2="276" y2="368" class="grid" />
  <line x1="388" y1="150" x2="388" y2="368" class="grid" />
  <text x="48" y="385" class="t-sub">0%</text>
  <text x="152" y="385" class="t-sub">+2%</text>
  <text x="264" y="385" class="t-sub">+4%</text>
  <text x="374" y="385" class="t-sub">+6%</text>

  <!-- Scale: 56px per 1% -->
  <text x="58" y="172" class="t-b">다우존스 (50,774.94, +591.99pt)</text>
  <rect x="52" y="180" width="66.1" height="22" rx="4" fill="#78716c" />
  <text x="126" y="196" class="t-v">+1.18%</text>

  <text x="58" y="226" class="t-b">S&amp;P 500 (7,297.49, +114.71pt)</text>
  <rect x="52" y="234" width="89.6" height="22" rx="4" fill="#2c4257" />
  <text x="150" y="250" class="t-v" fill="#2c4257">+1.60%</text>

  <text x="58" y="280" class="t-b">나스닥 종합 (24,129.50, +543.70pt)</text>
  <rect x="52" y="288" width="129.4" height="22" rx="4" fill="#1f514c" />
  <text x="190" y="304" class="t-v" fill="#1f514c">+2.31%</text>

  <text x="58" y="334" class="t-b" font-weight="700">필라델피아 반도체지수 (SOX)</text>
  <rect x="52" y="342" width="262.6" height="24" rx="4" fill="#163d39" />
  <text x="322" y="359" class="t-v" fill="#163d39">+4.69%</text>

  <!-- Right Panel: Key Stocks -->
  <rect x="434" y="82" width="418" height="334" rx="12" class="panel" />
  <text x="454" y="110" class="t-h">B. 주요 반도체·AI 종목 일간 반등률 (%)</text>
  <text x="454" y="128" class="t-b">메모리·AI 반등 강세 vs 엔비디아 +0.88% 소폭 상승</text>

  <!-- Scale: 22px per 1% from x=462 -->
  <line x1="462" y1="148" x2="462" y2="378" stroke="#a8a29e" stroke-width="1.2" />
  <line x1="572" y1="148" x2="572" y2="378" class="grid" />
  <line x1="682" y1="148" x2="682" y2="378" class="grid" />
  <text x="458" y="395" class="t-sub">0%</text>
  <text x="562" y="395" class="t-sub">+5%</text>
  <text x="670" y="395" class="t-sub">+10%</text>

  <text x="468" y="164" class="t-b">엔비디아 (Nvidia)</text>
  <rect x="462" y="170" width="19.4" height="16" rx="3" fill="#78716c" />
  <text x="488" y="182" class="t-v">+0.88%</text>

  <text x="468" y="204" class="t-b">브로드컴 (Broadcom)</text>
  <rect x="462" y="210" width="83.8" height="16" rx="3" fill="#2c4257" />
  <text x="554" y="222" class="t-v">+3.81%</text>

  <text x="468" y="244" class="t-b">AMD</text>
  <rect x="462" y="250" width="107.6" height="16" rx="3" fill="#2c4257" />
  <text x="578" y="262" class="t-v">+4.89%</text>

  <text x="468" y="284" class="t-b">마이크론 (Micron)</text>
  <rect x="462" y="290" width="161.5" height="16" rx="3" fill="#1f514c" />
  <text x="632" y="302" class="t-v" fill="#1f514c">+7.34%</text>

  <text x="468" y="324" class="t-b">SK하이닉스 ADR</text>
  <rect x="462" y="330" width="162.4" height="16" rx="3" fill="#1f514c" />
  <text x="632" y="342" class="t-v" fill="#1f514c">+7.38%</text>

  <text x="468" y="362" class="t-b" font-weight="700">앤트로픽 (Anthropic, 공모가 $83 회복)</text>
  <rect x="462" y="368" width="242" height="16" rx="3" fill="#b45309" />
  <text x="712" y="380" class="t-v" fill="#b45309">~+11%</text>

  <text x="32" y="440" class="t-sub">도표는 2026년 11월 27일(현지시간) 뉴욕증시 블랙프라이데이 조기 폐장 기준 공개 종가·등락률로 직접 작성했다.</text>
</svg>
