<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1d2b2a">실험실에서 '길들여진' 과정 — Hall A 균주에 일어난 두 가지 변화</text>
  <text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5c6b6a">PNAS 2026년 10월 15일, 카임 연구팀이 1,000개 이상 게놈을 비교해 확인</text>

  <!-- step 1 -->
  <rect x="60" y="120" width="240" height="300" rx="14" fill="#ffffff" stroke="#16756a" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#16756a">① DNA 수복 상실</text>
  <line x1="90" y1="175" x2="270" y2="175" stroke="#16756a" stroke-width="1"/>
  <g font-family="sans-serif" font-size="15" fill="#1d2b2a">
    <text x="180" y="210" text-anchor="middle">손상된 DNA를 고치는</text>
    <text x="180" y="233" text-anchor="middle"><tspan font-weight="bold">mutS 유전자</tspan>의 기능 상실</text>
    <text x="180" y="270" text-anchor="middle" font-size="14" fill="#5c6b6a">돌연변이 역추적 결과</text>
    <text x="180" y="292" text-anchor="middle" font-size="14" fill="#5c6b6a">초기 배양 단계에 이미 변이 발생</text>
    <text x="180" y="345" text-anchor="middle" font-size="16">수복이 안 되니</text>
    <text x="180" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#e0795b">돌연변이가 계속 쌓임</text>
  </g>

  <!-- arrow -->
  <text x="330" y="280" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#16756a">→</text>

  <!-- step 2 -->
  <rect x="360" y="120" width="240" height="300" rx="14" fill="#ffffff" stroke="#16756a" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#16756a">② 포자 미형성 균주</text>
  <line x1="390" y1="175" x2="570" y2="175" stroke="#16756a" stroke-width="1"/>
  <g font-family="sans-serif" font-size="15" fill="#1d2b2a">
    <text x="480" y="210" text-anchor="middle">악조건에서 휴면하는</text>
    <text x="480" y="233" text-anchor="middle"><tspan font-weight="bold">내생포자를 만들지 않음</tspan></text>
    <text x="480" y="270" text-anchor="middle" font-size="14" fill="#5c6b6a">자연에서는 필수지만</text>
    <text x="480" y="292" text-anchor="middle" font-size="14" fill="#5c6b6a">실험실 최적 조건에선 불필요</text>
    <text x="480" y="345" text-anchor="middle" font-size="16">아낀 자원을 다른 데에 사용</text>
    <text x="480" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#e0795b">성장·톡신 생산 증가</text>
  </g>

  <!-- arrow -->
  <text x="630" y="280" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#16756a">→</text>

  <!-- result -->
  <rect x="660" y="120" width="180" height="300" rx="14" fill="#16756a"/>
  <g font-family="sans-serif" fill="#ffffff">
    <text x="750" y="165" text-anchor="middle" font-size="20" font-weight="bold">결과</text>
    <line x1="690" y1="180" x2="810" y2="180" stroke="#ffffff" stroke-width="1"/>
    <text x="750" y="225" text-anchor="middle" font-size="15">야생형 BrDuraA보다</text>
    <text x="750" y="248" text-anchor="middle" font-size="15">실험실에서 더 잘 자라고</text>
    <text x="750" y="271" text-anchor="middle" font-size="15">톡신도 더 많이 생산</text>
    <text x="750" y="320" text-anchor="middle" font-size="14" font-style="italic" fill="#f4f1ea">포자 미형성이 톡신 증가의</text>
    <text x="750" y="342" text-anchor="middle" font-size="14" font-style="italic" fill="#f4f1ea">직접 원인은 미확인</text>
    <text x="750" y="390" text-anchor="middle" font-size="15" font-weight="bold">상업화에 유리한 형질</text>
  </g>

  <text x="450" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a9695">수치는 논문·보도에서 직접 인용해 작성</text>
</svg>
