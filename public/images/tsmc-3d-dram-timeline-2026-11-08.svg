<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#20231f">보도 하루 만에 부인 — TSMC 3D D램 논란 타임라인</text>
  <line x1="90" y1="86" x2="90" y2="446" stroke="#16756a" stroke-width="3"/>
  <circle cx="90" cy="110" r="9" fill="#e0795b"/>
  <text x="120" y="106" font-size="18" font-weight="bold" fill="#20231f">11월 5일(목) — TSMC ADR 42.65달러 급락</text>
  <text x="120" y="132" font-size="15" fill="#20231f">353.10달러 마감 · 미국 AI주 매도 여파</text>
  <circle cx="90" cy="180" r="9" fill="#e0795b"/>
  <text x="120" y="176" font-size="18" font-weight="bold" fill="#20231f">11월 6일(금) — 디 인포메이션 보도</text>
  <text x="120" y="202" font-size="15" fill="#20231f">“TSMC, 엔비디아 요청에 3D D램 검토” · 로이터 전재</text>
  <text x="120" y="224" font-size="15" fill="#20231f">ADR 375.44달러 마감, 하루 만에 +6.33%</text>
  <circle cx="90" cy="272" r="9" fill="#16756a"/>
  <text x="120" y="268" font-size="18" font-weight="bold" fill="#20231f">11월 7일(토) — TSMC 사실상 부인</text>
  <text x="120" y="294" font-size="15" fill="#20231f">톰스하드웨어에 “핵심 사업은 언제나 로직 파운드리”</text>
  <circle cx="90" cy="342" r="9" fill="#16756a"/>
  <text x="120" y="338" font-size="18" font-weight="bold" fill="#20231f">11월 9일(월) — 대만 장중 공매도 제한 시행</text>
  <text x="120" y="364" font-size="15" fill="#20231f">빌린 주식 매도 한도, 일평균 거래량의 30%에서 3%로</text>
  <circle cx="90" cy="412" r="9" fill="#16756a"/>
  <text x="120" y="408" font-size="18" font-weight="bold" fill="#20231f">11월 10일(화) — TSMC 10월 매출 발표 예정</text>
  <text x="120" y="434" font-size="15" fill="#20231f">3분기 매출 467억 2,000만 달러 · 4분기 가이던스 523억~543억 달러</text>
  <text x="450" y="490" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: 디 인포메이션·로이터·톰스하드웨어·TSMC (2026.11.05–07)</text>
</svg>
