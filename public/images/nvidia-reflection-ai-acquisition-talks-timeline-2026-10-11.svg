  <text x="810" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#20231f">10월 10일</text>
  <text x="810" y="102" text-anchor="middle" font-size="18" fill="#62655d">FT "추가 투자·인수 협상" 보도</text>
