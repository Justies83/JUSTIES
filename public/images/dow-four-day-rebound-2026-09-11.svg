  <line x1="60" y1="440" x2="840" y2="440" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="468" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">같은 날 WTI는 배럴당 99.98달러로 2.44% 내려 다시 100달러 밑으로 돌아왔다</text>
  <text x="60" y="490" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 지난 발행 수치와 블록미디어 9.11 보도를 직접 작성</text>
