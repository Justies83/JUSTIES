  <circle cx="350" cy="270" r="6.5" fill="#62655d"/>
  <circle cx="550" cy="320" r="7" fill="#62655d"/>
  <circle cx="750" cy="175" r="8" fill="#16756a"/>

  <text x="150" y="188" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#62655d">52,786</text>
  <text x="350" y="248" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#62655d">52,381</text>
  <text x="550" y="352" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#62655d">52,064</text>
  <text x="750" y="153" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" fill="#16756a">52,588</text>

  <text x="150" y="384" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">9.8</text>
  <text x="150" y="404" text-anchor="middle" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#20231f">-1.18%</text>

  <text x="350" y="384" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">9.9</text>
  <text x="350" y="404" text-anchor="middle" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#20231f">-0.77%</text>

