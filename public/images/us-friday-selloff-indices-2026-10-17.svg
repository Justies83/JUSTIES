  <text x="450" y="472" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#62655d">종가 기준: 2026.10.16 미국 동부 / 주간: 4.5% 하락은 6월 26일 주 이후 최대</text>
