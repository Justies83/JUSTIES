  <text x="74" y="432" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#20231f">수석을 빼면 90점 이상 응시자는 0명 — 1차 4과목 160문항 중 수석은 159개 정답</text>

  <text x="74" y="492" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">중앙일보·이투데이 2026년 11월 15일 보도 수치로 직접 작성</text>
