  <text x="150" y="242" font-family="sans-serif" font-size="18" fill="#62655d">취소 6,785편 · 지연 7,343편 · 비행기·승무원 재배치 지연</text>
  <circle cx="120" cy="310" r="12" fill="#e0795b"/>
