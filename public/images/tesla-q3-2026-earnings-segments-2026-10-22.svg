  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#666">단위: 억 달러 · 전년 동기 대비 · 테슬라 3분기 업데이트(2026.10.21) 기준</text>
  <text x="220" y="102" text-anchor="end" font-size="14" fill="#20231f">자동차 (-3%)</text>
  <rect x="230" y="84" width="480" height="22" fill="#cc0000"/>
  <text x="720" y="100" font-size="14" font-weight="bold" fill="#20231f">205.6억</text>
  <text x="220" y="152" text-anchor="end" font-size="14" fill="#20231f">에너지 (-15.6%)</text>
  <rect x="230" y="134" width="67" height="22" fill="#e0795b"/>
  <text x="307" y="150" font-size="14" font-weight="bold" fill="#20231f">28.8억</text>
