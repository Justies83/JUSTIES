<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img">
  <defs>
    <style>
      .bg { fill: #f8f7f4; }
      .panel { fill: #ffffff; stroke: #d8d4ca; stroke-width: 1.5; }
      .panel-teal { fill: #ebf2f0; stroke: #1f514c; stroke-width: 1.5; }
      .panel-slate { fill: #eef2f6; stroke: #2c4257; stroke-width: 1.5; }
      .panel-warn { fill: #fdf6ee; stroke: #d99b52; stroke-width: 1.5; }
      .t-title { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #171717; }
      .t-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #57534e; letter-spacing: 1.0px; }
      .t-h { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 700; fill: #171717; }
      .t-b { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 12px; fill: #44403c; }
      .t-s { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 11px; fill: #57534e; }
      .t-m { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #1f514c; font-weight: 700; }
      .t-w { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #b45309; font-weight: 700; }
      .t-slate { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #2c4257; font-weight: 700; }
      .grid { stroke: #ebe7de; stroke-width: 1; }
      .axis { stroke: #78716c; stroke-width: 1.3; }
      .arrow { stroke: #1f514c; stroke-width: 2; fill: none; marker-end: url(#arr-t); }
      .arrow-s { stroke: #2c4257; stroke-width: 2; fill: none; marker-end: url(#arr-s); }
      .arrow-w { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#arr-w); }
    </style>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f514c" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2c4257" />
    </marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>
  <rect class="bg" width="880" height="480" />

  <text x="32" y="34" class="t-sub">EMPIRICAL FACTORING &amp; QUANTUM RESOURCE ESTIMATES · 1994–2035</text>
  <text x="32" y="60" class="t-title">고전 소인수분해 한계(RSA-250) 대 양자 해독 비용 20배 급감과 NIST 전환 일정</text>

  <!-- Panel A: Classical vs Quantum Resource Drop -->
  <rect x="28" y="82" width="420" height="348" rx="12" class="panel" />
  <text x="48" y="108" class="t-h">A. RSA-2048 해독에 필요한 물리 큐비트 추정치</text>
  <text x="48" y="126" class="t-b">오류정정(표면 부호) + 매직 상태 배양 최적화 효과</text>

  <!-- Bars (x=76..396 -> 320px = 20M) -->
  <line x1="76" y1="150" x2="76" y2="275" class="axis" />
  <line x1="76" y1="275" x2="404" y2="275" class="axis" />
  <line x1="236" y1="150" x2="236" y2="275" class="grid" />
  <line x1="396" y1="150" x2="396" y2="275" class="grid" />
  <text x="76" y="292" text-anchor="middle" class="t-sub">0</text>
  <text x="236" y="292" text-anchor="middle" class="t-sub">1,000만</text>
  <text x="396" y="292" text-anchor="middle" class="t-sub">2,000만 큐비트</text>

  <text x="84" y="172" class="t-b" font-weight="700">2019/2021 · Gidney &amp; Ekerå (8시간 기준)</text>
  <rect x="76" y="180" width="320" height="28" rx="4" fill="#2c4257" />
  <text x="86" y="199" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#ffffff" font-weight="700">~20,000,000 물리 큐비트</text>

  <text x="84" y="228" class="t-b" font-weight="700">2025.05 · Gidney (arXiv:2505.15917, &lt;1주일 기준)</text>
  <rect x="76" y="236" width="15" height="28" rx="4" fill="#b45309" />
  <text x="100" y="255" class="t-w">&lt;1,000,000 물리 큐비트 (20배 감축)</text>

  <!-- Classical benchmark callout -->
  <rect x="48" y="310" width="380" height="104" rx="8" fill="#f8f7f4" stroke="#d8d4ca" />
  <text x="62" y="330" class="t-m">고전 슈퍼컴퓨터 실제 소인수분해 기록 (CADO-NFS / GNFS)</text>
  <text x="62" y="350" class="t-b">• RSA-768 (232자리, 2009): 약 1,500 코어-년 소요</text>
  <text x="62" y="368" class="t-b">• RSA-250 (829비트, 2020.02): 약 2,700 코어-년 (현재 공개 최장)</text>
  <text x="62" y="386" class="t-b">• RSA-2048 (617자리): 고전 계산으로는 사실상 해독 불가 영역</text>
  <text x="62" y="403" class="t-s">※ 현존 양자 하드웨어는 수천 큐비트 단계라 실제 Q-Day까지 격차 존재</text>

  <!-- Panel B: NIST Transition Timeline -->
  <rect x="466" y="82" width="386" height="348" rx="12" class="panel-teal" />
  <text x="486" y="108" class="t-m">B. 글로벌 암호 전환 타임라인 (NIST)</text>
  <text x="486" y="128" class="t-h">소수 기반(RSA/ECC)에서 양자내성(PQC)으로</text>

  <line x1="504" y1="152" x2="504" y2="395" stroke="#1f514c" stroke-width="2" />

  <circle cx="504" cy="166" r="5.5" fill="#1f514c" />
  <text x="520" y="170" class="t-m">2024.08 · FIPS 203 / 204 / 205 확정</text>
  <text x="520" y="187" class="t-b">ML-KEM, ML-DSA, SLH-DSA 연방 표준 공표</text>

  <circle cx="504" cy="218" r="5.5" fill="#1f514c" />
  <text x="520" y="222" class="t-m">2024.11 · NIST IR 8547 초안 공개</text>
  <text x="520" y="239" class="t-b">RSA·ECDSA·DH 단계적 퇴출 공식 로드맵</text>

  <circle cx="504" cy="270" r="5.5" fill="#1f514c" />
  <text x="520" y="274" class="t-m">2025.03 · HQC (5번째 백업 표준) 선정</text>
  <text x="520" y="291" class="t-b">격자 외 부호 기반 다변화로 단일 실패 방지</text>

  <circle cx="504" cy="322" r="6" fill="#b45309" />
  <text x="520" y="326" class="t-w">2030년 이후 · RSA/ECC 신규·권고 중단</text>
  <text x="520" y="343" class="t-b">Deprecated: 위험 수용 시에만 제한적 허용</text>

  <circle cx="504" cy="374" r="6" fill="#9a3412" />
  <text x="520" y="378" class="t-w">2035년 이후 · 기존 공개키 암호 전면 금지</text>
  <text x="520" y="395" class="t-b">Disallowed: 연방 표준 암호 체계 완전 교체</text>

  <text x="32" y="458" class="t-sub">도표는 Boudot et al.(2020), Gidney &amp; Ekerå(2021), Gidney(2025), NIST FIPS 203-205 및 IR 8547의 공개 수치를 바탕으로 작성했다.</text>

</svg>
