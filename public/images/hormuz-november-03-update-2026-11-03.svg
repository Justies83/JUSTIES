<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="호르무즈 11월 3일 업데이트 타임라인">
<rect width="800" height="360" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 3일 업데이트 — 같은 날의 공습과 외교</text>
<line x1="60" y1="80" x2="60" y2="310" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">미국, 케슘섬 제한적 방어 공습</text><text x="84" y="120" fill="#cfe3ef" font-size="15">AP 보도 · 지대공 미사일 대응 · 전면전 재개는 아니라고 구분</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">알 주수피 피격 · 선원 1명 사망, 13명 구조</text><text x="84" y="180" fill="#cfe3ef" font-size="15">인도 선적 · 오만 해안 · 오만 해안경비대가 구조</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">혁명수비대 주장 · 9일간 11척 화재, 일부 침몰</text><text x="84" y="240" fill="#cfe3ef" font-size="15">독립 확인 없음 · 7일 재개안을 2일로 단축 가능 조건은 봉쇄 해제</text>
<circle cx="60" cy="280" r="8" fill="#f2b705"/><text x="84" y="276" fill="#ffffff" font-size="17" font-weight="700">국제해사기구 · 기뢰 제거 미확인, 통항 자제 권고 유지</text><text x="84" y="300" fill="#cfe3ef" font-size="15">걸프 선박 350~400척 · 선원 약 6,000명 발 묶임 · 10월 공격 약 30건</text>
<text x="40" y="340" fill="#8fb3c7" font-size="13">출처: AP, 아랍뉴스, NHK 월드, 국제해사기구 사무총장 발언 보도</text>
</svg>
