<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ASML 분기 순매출 추이">
  <rect width="900" height="560" fill="#f4f1ea"/>
  <text x="450" y="56" text-anchor="middle" font-size="30" fill="#20231f" font-weight="bold">ASML 분기 순매출 추이</text>
  <text x="450" y="90" text-anchor="middle" font-size="17" fill="#62655d">단위: 10억 유로 · 2026년 3분기 116.6억 유로로 분기 최대</text>

  <line x1="110" y1="400" x2="790" y2="400" stroke="#62655d" stroke-width="2.5"/>

  <g font-size="22" fill="#20231f">
    <rect x="170" y="212" width="120" height="188" fill="#16756a" opacity="0.55"/>
    <text x="230" y="180" text-anchor="middle" font-weight="bold">75.2</text>
    <text x="230" y="440" text-anchor="middle" font-size="20">2025년 3분기</text>

    <rect x="390" y="167" width="120" height="233" fill="#16756a" opacity="0.75"/>
    <text x="450" y="135" text-anchor="middle" font-weight="bold">93.3</text>
    <text x="450" y="440" text-anchor="middle" font-size="20">2026년 2분기</text>

    <rect x="610" y="108" width="120" height="292" fill="#16756a"/>
    <text x="670" y="76" text-anchor="middle" font-weight="bold">116.6</text>
    <text x="670" y="440" text-anchor="middle" font-size="20">2026년 3분기</text>
  </g>

  <rect x="90" y="470" width="720" height="64" fill="none" stroke="#62655d" stroke-width="1.5"/>
  <text x="450" y="497" text-anchor="middle" font-size="18" fill="#20231f">2026년 연간 순매출 가이던스: 4월 360~400억 → 7월 430~450억 → 10월 440~450억 유로</text>
  <text x="450" y="522" text-anchor="middle" font-size="15" fill="#62655d">올해 들어 세 번째 상향 · 4분기 가이던스 142~152억 유로</text>
</svg>
