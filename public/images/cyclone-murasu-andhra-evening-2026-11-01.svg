<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#fafafa"/>
<text x="40" y="40" font-size="22" font-weight="bold" fill="#111">무라수 저녁 업데이트 — 한밤중 횡단, 첫 폭풍 해일 경고</text>
<text x="40" y="68" font-size="14" fill="#555">인도 기상청 11월 1일 오후 2시 30분 특보(제6호) 기준. 횡단 시각이 11월 3일 아침에서 한밤중으로 좁혀졌다.</text>
<text x="40" y="118" font-size="15" fill="#333">11월 2일 오전쯤 — 강한 사이클론 단계로 발달 예보</text>
<text x="40" y="148" font-size="17" font-weight="bold" fill="#c0392b">11월 2일 밤 11시 30분 ~ 11월 3일 새벽 4시 — 넬로르와 나르사푸르 사이 횡단</text>
<text x="40" y="178" font-size="15" fill="#333">횡단 당시 풍속 시속 100에서 110km, 돌풍 시속 120km (변동 없음)</text>
<text x="40" y="228" font-size="17" font-weight="bold" fill="#1f4e79">처음 나온 폭풍 해일 경고</text>
<text x="40" y="258" font-size="15" fill="#333">조위보다 약 1m 높은 해수 — 남부 해안 안드라 저지대 침수 가능</text>
<text x="40" y="288" font-size="15" fill="#333">가장 높은 곳: 바팟라, 크리슈나, 프라카삼 지구</text>
<text x="40" y="338" font-size="17" font-weight="bold" fill="#1f4e79">지구별 적색 경보 (극심한 비, 하루 204mm 초과 기준)</text>
<text x="40" y="368" font-size="15" fill="#333">11월 2일: 넬로르, 프라카삼, 바팟라, 군투르, 크리슈나 — 5개 지구</text>
<text x="40" y="398" font-size="15" fill="#333">11월 3일: 적색 경보가 내륙 엘루루와 알루리 시타라마 라주 지구로 이동</text>
<text x="40" y="448" font-size="17" font-weight="bold" fill="#1f4e79">해안 바람 시간표</text>
<text x="40" y="478" font-size="15" fill="#333">11월 2일 정오 시속 65에서 75km → 저녁 80에서 90km → 자정부터 11월 3일 정오 100에서 110km</text>
</svg>
