<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#20231f">피해 현황 — 사망 9명, 부상 15명</text>
  <text x="70" y="158" font-size="18" font-weight="bold" fill="#20231f">사망</text>
  <rect x="170" y="128" width="336" height="44" fill="#e0795b"/>
  <text x="518" y="158" font-size="20" font-weight="bold" fill="#20231f">9명</text>
  <text x="170" y="206" font-size="15" fill="#20231f">광장 6명(여성 4명·남성 2명, 영국인 1명 포함) + 자택 3명(여성 2명·남성 1명, 가족으로 추정)</text>
  <text x="70" y="268" font-size="18" font-weight="bold" fill="#20231f">부상</text>
  <rect x="170" y="238" width="560" height="44" fill="#16756a"/>
  <text x="742" y="268" font-size="20" font-weight="bold" fill="#20231f">15명</text>
  <text x="170" y="316" font-size="15" fill="#20231f">중상 12명 · 외국인 5명 · 경찰관 2명 (범주는 겹친다)</text>
  <line x1="70" y1="360" x2="830" y2="360" stroke="#62655d" stroke-width="1"/>
  <text x="450" y="404" text-anchor="middle" font-size="17" fill="#20231f">첫 신고 뒤 <tspan font-weight="bold">23초</tspan> 만에 첫 순찰차 도착 · <tspan font-weight="bold">3분</tspan> 안에 경찰 첫 발포</text>
  <text x="450" y="438" text-anchor="middle" font-size="14" fill="#62655d">내무장관: "번개 같은 대응이 훨씬 큰 참사를 막았다"</text>
  <text x="450" y="490" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: 마이우폴스카 경찰·폴란드 내무장관·로이터·예루살렘포스트 (2026.11.07–08)</text>
</svg>
