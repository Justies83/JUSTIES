<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#f4f1ea"/>
<text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">10월 16일 초안, 40개 기술의 구성</text>
<text x="450" y="70" text-anchor="middle" font-size="14" fill="#62655d">중국 상무부·과학기술부 공동 초안 (Announcement No. 48)</text>
<text x="80" y="115" font-size="16" font-weight="bold" fill="#20231f">분야별 개수</text>
<text x="80" y="150" font-size="15" fill="#20231f">인공지능 23개</text>
<rect x="230" y="135" width="460" height="22" fill="#16756a"/>
<text x="80" y="190" font-size="15" fill="#20231f">태양광 12개</text>
<rect x="230" y="175" width="240" height="22" fill="#16756a" opacity="0.65"/>
<text x="80" y="230" font-size="15" fill="#20231f">바이오의약 5개</text>
<rect x="230" y="215" width="100" height="22" fill="#16756a" opacity="0.4"/>
<text x="80" y="275" font-size="16" font-weight="bold" fill="#20231f">금지·제한 구분 (전체 40개)</text>
<text x="80" y="310" font-size="15" fill="#20231f">수출 금지 14개</text>
<rect x="230" y="295" width="280" height="22" fill="#e0795b"/>
<text x="80" y="350" font-size="15" fill="#20231f">수출 제한 26개</text>
<rect x="230" y="335" width="520" height="22" fill="#e0795b" opacity="0.6"/>
<text x="450" y="385" text-anchor="middle" font-size="13" fill="#62655d">인공지능 안에서는 금지 6개, 제한 17개. 의견수렴 2026년 11월 15일까지, 임시 등록제는 공개 당일부터 적용</text>
</svg>
