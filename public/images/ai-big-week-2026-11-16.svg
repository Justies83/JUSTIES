  <circle cx="370" cy="260" r="10" fill="#e0795b"/>
  <circle cx="570" cy="260" r="10" fill="#16756a"/>
  <circle cx="770" cy="260" r="10" fill="#e0795b"/>

  <text x="170" y="210" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#20231f">11월 16일</text>
  <text x="370" y="210" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#20231f">11월 17일</text>
  <text x="570" y="210" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#20231f">11월 18일</text>
  <text x="770" y="210" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#20231f">11월 19일</text>

