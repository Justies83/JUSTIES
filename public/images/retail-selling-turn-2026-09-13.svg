<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="개인투자자의 삼성전자 월별 순매수 도표. 5월 9조 6050억원, 6월 17조 1190억원으로 정점을 찍은 뒤 7월 5조 470억원, 8월 2조 380억원으로 줄어들다 9월 1일부터 11일까지 5조 2120억원 순매도로 돌아섰다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">RETAIL FLOWS — MAY~SEP</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">넉 달 사던 개인이 9월 들어 팔기 시작했다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">삼성전자, 개인투자자 월별 순매수·순매도 (조원)</text>

  <!-- zero line -->
  <line x1="60" y1="300" x2="840" y2="300" stroke="rgba(32,35,31,.2)"/>
  <text x="52" y="304" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#62655d">0</text>

  <!-- bars: 5월 +9.605, 6월 +17.119, 7월 +5.047, 8월 +2.038, 9월(1~11) -5.212 -->
  <!-- scale: 17.119 -> 140px tall -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13">
    <rect x="110" y="221" width="90" height="79" fill="#16756a" opacity="0.55"/>
    <text x="155" y="212" text-anchor="middle" fill="#16756a">+9.6</text>
    <text x="155" y="320" text-anchor="middle" fill="#62655d" font-size="12.5">5월</text>

    <rect x="240" y="160" width="90" height="140" fill="#16756a"/>
    <text x="285" y="151" text-anchor="middle" fill="#16756a">+17.1</text>
    <text x="285" y="320" text-anchor="middle" fill="#62655d" font-size="12.5">6월</text>

    <rect x="370" y="259" width="90" height="41" fill="#16756a" opacity="0.55"/>
    <text x="415" y="250" text-anchor="middle" fill="#16756a">+5.0</text>
    <text x="415" y="320" text-anchor="middle" fill="#62655d" font-size="12.5">7월</text>

    <rect x="500" y="283" width="90" height="17" fill="#16756a" opacity="0.4"/>
    <text x="545" y="274" text-anchor="middle" fill="#16756a">+2.0</text>
    <text x="545" y="320" text-anchor="middle" fill="#62655d" font-size="12.5">8월</text>

    <rect x="630" y="300" width="90" height="43" fill="#e0795b"/>
    <text x="675" y="360" text-anchor="middle" fill="#e0795b">-5.2</text>
    <text x="675" y="382" text-anchor="middle" fill="#62655d" font-size="12.5">9월(~11일)</text>
  </g>

  <line x1="60" y1="440" x2="840" y2="440" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="466" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">같은 기간 SK하이닉스도 5·6월 15조원대 순매수에서 9월 7조 8180억원 순매도로 전환</text>
  <text x="60" y="488" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 브릿지경제·전남일보 보도 수치로 직접 작성</text>
</svg>
