  <text x="74" y="44" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">ANTHROPIC IPO · S-1/A 2026.11.10</text>
  <text x="74" y="72" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">공모가별 조달 규모 — 8억 2,500만 주 기준 (10억 달러)</text>
  <line x1="74" y1="420" x2="840" y2="420" stroke="rgba(32,35,31,.16)"/>
