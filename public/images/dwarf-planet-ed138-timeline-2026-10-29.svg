  <circle cx="820" cy="130" r="12" fill="#ffffff" stroke="#f2a33c" stroke-width="3"/>
  <text x="820" y="105" font-size="14" fill="#ffffff" text-anchor="middle">앞으로 수개월</text>
  <text x="820" y="170" font-size="12" fill="#9aa7bd" text-anchor="middle">알마 크기 측정 후</text>
  <text x="820" y="188" font-size="12" fill="#9aa7bd" text-anchor="middle">IAU 확인·명명</text>
