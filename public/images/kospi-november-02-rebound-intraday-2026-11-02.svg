    <text x="80" y="170" text-anchor="middle" font-weight="bold">전일 종가</text>
    <text x="80" y="215" text-anchor="middle" fill="#555555">5,730.74</text>
    <circle cx="220" cy="258" r="7" fill="#c0392b"/>
