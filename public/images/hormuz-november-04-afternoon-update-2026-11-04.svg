<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-label="호르무즈 11월 4일 오후 업데이트">
<rect width="800" height="380" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 4일 오후 업데이트 — 트럼프가 공습을 확인했다</text>
<line x1="60" y1="80" x2="60" y2="320" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">트럼프 (폭스뉴스, 화요일) · 케슘섬 공습 직접 확인</text><text x="84" y="120" fill="#cfe3ef" font-size="15">대공시설 완성 직후 타격 · “사소한 공격, 전쟁이 아니다”</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">UKMTO (화요일) · 오만 리마 앞바다 유조선 피격</text><text x="84" y="180" fill="#cfe3ef" font-size="15">미확인 투사체 2발이 기관실 명중 · 사상자 없음</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">혁명수비대 주장 (미확인) · 유조선 4척 기뢰 폭발, 2척 나포</text><text x="84" y="240" fill="#cfe3ef" font-size="15">선박명·사상자 미공개 · UKMTO 사건과 같은 배인지 확인 안 됨</text>
<circle cx="60" cy="280" r="8" fill="#f2b705"/><text x="84" y="276" fill="#ffffff" font-size="17" font-weight="700">카타르 중재 · 대화 채널은 계속</text><text x="84" y="300" fill="#cfe3ef" font-size="15">양측 협상 과정에 계속 참여 · 실시간 제안 교환 중재 중</text>
<text x="40" y="360" fill="#8fb3c7" font-size="13">출처: 알자지라 11월 4일 보도, 로이터를 인용한 Report.az 11월 4일 보도</text>
</svg>
