<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">무라수 오후 집계 — 약화 확인, 피해는 숫자로</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#62655d">인도 기상청 11월 3일 오후 4시 특보와 NDTV·알 자지라 보도 기준 · 시각은 인도 표준시</text>
  <text x="120" y="125" font-size="17" fill="#20231f">오후 2시 30분: 사이클론 단계로 약화, 북북서쪽 시속 7km</text>
  <rect x="120" y="138" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="138" width="300" height="34" fill="#16756a"/>
  <text x="120" y="215" font-size="17" fill="#20231f">중심: 바팟라 서북서쪽 약 40km · 옹골 북쪽 약 60km</text>
  <rect x="120" y="228" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="228" width="420" height="34" fill="#20231f"/>
  <text x="120" y="305" font-size="17" fill="#20231f">농작물 피해 30,661헥타르 · 15개 지구 · 132개 만달</text>
  <rect x="120" y="318" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="318" width="520" height="34" fill="#e0795b"/>
  <text x="120" y="395" font-size="17" fill="#20231f">구호 캠프 171곳에 10,805명 · NDRF 11팀 SDRF 13팀</text>
  <text x="450" y="455" text-anchor="middle" font-size="14" fill="#62655d">사망·부상 보고 없음 · 적색 경보 6개 지구 유지 · 철도 7편 취소</text>
  <text x="450" y="482" text-anchor="middle" font-size="14" fill="#62655d">다음 관전 포인트는 내륙의 비와 복구·보상 집계</text>
</svg>
