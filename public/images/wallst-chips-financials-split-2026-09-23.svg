<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="9월 22일 등락률 비교 도표. 미국 다우존스는 0.36퍼센트 하락, S&amp;P500은 보합, 나스닥은 0.45퍼센트 상승(2거래일 연속 최고치)했다. 필라델피아반도체지수는 2.06퍼센트, 마이크론은 5.00퍼센트 올랐다. 같은 날 국내에서는 삼성전자가 0.91퍼센트 오른 반면 SK하이닉스는 1.50퍼센트 내렸다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">MARKET SPLIT — SEP 22</text>
