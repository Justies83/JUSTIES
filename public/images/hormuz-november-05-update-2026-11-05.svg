<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="호르무즈 11월 5일 업데이트">
<rect width="800" height="440" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 5일 업데이트 — 밤사이 주장과 청해부대 확대안</text>
<line x1="60" y1="80" x2="60" y2="380" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">혁명수비대 주장 (미확인) · 밤사이 유조선 2척 화재</text><text x="84" y="120" fill="#cfe3ef" font-size="15">남쪽 비인가 항로 기뢰 충돌 · 선박명·사상자 미공개</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">예인선도 화재 · 드론 2기 노획 주장</text><text x="84" y="180" fill="#cfe3ef" font-size="15">화재 진압 위해 접근한 예인선에도 불 · 미군 확인 없음</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">한국 청해부대 · 작전 해역 두쿰 인근까지 확대</text><text x="84" y="240" fill="#cfe3ef" font-size="15">해협에서 약 650km · 작전 반경 약 1,930km로 두 배</text>
<circle cx="60" cy="280" r="8" fill="#f2b705"/><text x="84" y="276" fill="#ffffff" font-size="17" font-weight="700">전력 증강 · P-8A, 폭발물처리반, 무인 기뢰 제거 장비</text><text x="84" y="300" fill="#cfe3ef" font-size="15">정원 75명 증원해 395명 · 새 임무 2027년 말까지</text>
<circle cx="60" cy="340" r="8" fill="#f2b705"/><text x="84" y="336" fill="#ffffff" font-size="17" font-weight="700">국방부 선긋기 · 비전투, 독자 지휘, 전쟁 불참</text><text x="84" y="360" fill="#cfe3ef" font-size="15">해협 내 작전은 별도 국회 승인 필요 · 국회 심의 쟁점</text>
<text x="40" y="420" fill="#8fb3c7" font-size="13">출처: 메흐르통신·로이터·코리아헤럴드 11월 5일 보도</text>
</svg>
