  <g font-size="16" fill="#1a1a1a">
    <text x="40" y="80" font-weight="bold">노스캐롤라이나</text><text x="760" y="80" text-anchor="end">쿠퍼 승</text>
    <text x="40" y="120" font-weight="bold">사우스캐롤라이나</text><text x="760" y="120" text-anchor="end">앤드루스 승</text>
    <text x="40" y="160" font-weight="bold">오하이오</text><text x="760" y="160" text-anchor="end">브라운 승</text>
    <text x="40" y="200" font-weight="bold">텍사스</text><text x="760" y="200" text-anchor="end">탈라리코 승</text>
