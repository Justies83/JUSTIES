<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="삼성전자 SK하이닉스 3분기 영업이익 컨센서스 도표. FnGuide 집계 기준 삼성전자 111조3800억원(전년비 815.47% 증가), SK하이닉스 78조1300억원(586.34% 증가), 합계 약 189조5000억원으로 국내 기업 최초 분기 100조 돌파다. 원달러 환율이 1450원에서 1350원으로 낮아지면 삼성전자 전망치는 105조5000억원으로 내려간다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">FNGUIDE CONSENSUS — Q3 2026</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">3분기 영업이익 190조원 눈앞 — 국내 첫 '분기 100조'</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">삼성전자·SK하이닉스 3분기 영업이익 컨센서스</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="80" y="164" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">삼성전자</text>
  <rect x="220" y="150" width="328" height="22" fill="#e0795b" opacity="0.75"/>
  <text x="558" y="167" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#e0795b">111조3,800억원 (+815.47%)</text>

  <text x="80" y="204" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">SK하이닉스</text>
  <rect x="220" y="190" width="230" height="22" fill="#16756a" opacity="0.6"/>
  <text x="460" y="207" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#16756a">78조1,300억원 (+586.34%)</text>

  <text x="80" y="244" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">합계 약 189조5,000억원 — 국내 기업 첫 '분기 영업이익 100조원' 돌파</text>

  <line x1="60" y1="268" x2="840" y2="268" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="292" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">실적 배경</text>
  <rect x="60" y="304" width="780" height="70" fill="#16756a" opacity="0.1"/>
  <text x="76" y="328" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">AI 데이터센터 메모리 수요 확대 · HBM4 매출 증가 · DDR5 공급 부족(리드타임 최대 52주)</text>
  <text x="76" y="348" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">3분기 범용 D램 가격 전분기 대비 13~18%↑ · 낸드플래시 10~15%↑ 전망</text>
  <text x="76" y="366" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">4분기에도 최고 실적 경신 이어질 것이라는 전망</text>

  <line x1="60" y1="396" x2="840" y2="396" stroke="rgba(32,35,31,.12)"/>

