  <g>
    <text x="170" y="102" text-anchor="end" font-size="15" fill="#20231f">펜실베이니아</text>
    <rect x="180" y="82" width="480" height="26" fill="#e0795b"/>
    <text x="672" y="101" font-size="16" font-weight="bold" fill="#20231f">1,467</text>
    <text x="170" y="172" text-anchor="end" font-size="15" fill="#20231f">사우스캐롤라이나</text>
    <rect x="180" y="152" width="219" height="26" fill="#16756a"/>
    <text x="411" y="171" font-size="16" font-weight="bold" fill="#20231f">670</text>
    <text x="170" y="242" text-anchor="end" font-size="15" fill="#20231f">유타</text>
    <rect x="180" y="222" width="175" height="26" fill="#16756a"/>
    <text x="367" y="241" font-size="16" font-weight="bold" fill="#20231f">536</text>
    <text x="170" y="312" text-anchor="end" font-size="15" fill="#20231f">위스콘신</text>
