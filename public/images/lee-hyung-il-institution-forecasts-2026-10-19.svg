<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">2026년 한국 성장률, 기관별 전망을 한눈에</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#666">출처: 각 기관 발표 · 부총리 언급(2026.10.16 현지) · 보도(YTN·세계일보·매일경제, 2026.10.19)</text>
  <g font-size="14">
    <!-- KDI 3.2, ADB 3.2 -->
    <text x="170" y="120" text-anchor="end" fill="#333">KDI</text>
    <rect x="190" y="98" width="170" height="28" fill="#94a3b8"/>
    <text x="368" y="119" fill="#1a1a1a" font-weight="bold">3.2%</text>
    <text x="170" y="160" text-anchor="end" fill="#333">ADB</text>
    <rect x="190" y="138" width="170" height="28" fill="#94a3b8"/>
    <text x="368" y="159" fill="#1a1a1a" font-weight="bold">3.2%</text>
    <!-- IMF 3.3, 한은 3.3 -->
    <text x="170" y="200" text-anchor="end" fill="#333">IMF</text>
    <rect x="190" y="178" width="220" height="28" fill="#1d4ed8"/>
    <text x="418" y="199" fill="#1a1a1a" font-weight="bold">3.3%</text>
    <text x="170" y="240" text-anchor="end" fill="#333">한국은행</text>
    <rect x="190" y="218" width="220" height="28" fill="#1d4ed8"/>
    <text x="418" y="239" fill="#1a1a1a" font-weight="bold">3.3%</text>
    <!-- 부총리 3.4~3.6 -->
    <text x="170" y="280" text-anchor="end" fill="#333">이형일 부총리</text>
    <rect x="190" y="258" width="270" height="28" fill="#16a34a"/>
    <text x="468" y="279" fill="#1a1a1a" font-weight="bold">3.4~3.6%</text>
    <!-- OECD 3.7 -->
    <text x="170" y="320" text-anchor="end" fill="#333">OECD</text>
    <rect x="190" y="298" width="320" height="28" fill="#f59e0b"/>
    <text x="518" y="319" fill="#1a1a1a" font-weight="bold">3.7%</text>
  </g>
  <text x="400" y="362" text-anchor="middle" font-size="13" fill="#444">부총리 발언은 "새로운 외부 이벤트가 없다면"이라는 단서 아래의 정책적 진단 — 정부 공식 전망치(7월, 3.0%)의 공식 수정은 아님</text>
</svg>
