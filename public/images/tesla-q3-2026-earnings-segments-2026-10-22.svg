  <text x="348" y="200" font-size="14" font-weight="bold" fill="#20231f">46.1억</text>
  <text x="400" y="248" text-anchor="middle" font-size="13" fill="#666">전체 매출 280.5억 달러로 전년과 거의 같았다. 서비스·기타에는 FSD 구독, 로보택시, 충전 사업이 포함된다.</text>
  <text x="400" y="282" text-anchor="middle" font-size="12" fill="#999">도표는 테슬라 2026년 3분기 업데이트(2026.10.21) 수치를 인용해 직접 작성했습니다.</text>
