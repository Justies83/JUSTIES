  <text x="650" y="185" text-anchor="middle" font-size="12" fill="#20231f">2027년 상반기 주 1회 발사 목표</text>
  <text x="650" y="203" text-anchor="middle" font-size="12" fill="#20231f">연말 연환산 매출 목표 5천억~1조 달러</text>
  <text x="400" y="260" text-anchor="middle" font-size="13" fill="#666">실적 발표에서 제시된 4분기 설비투자 가이던스는 350억~400억 달러로, 3분기의 두 배에 가깝다.</text>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#9ca3af">자료: 스페이스X 3분기 실적 콜 정리(모틀리풀, 2026.10.20) · 잭스(2026.10.21)</text>
