  <text x="76" y="156" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">10년물 국채금리 5.102% — 19년 만에 최고치</text>
  <text x="76" y="176" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">마이클 바 연준 이사 — "할 일이 남았다" · 10월 추가 금리인상 시사</text>

