  <line x1="328" y1="181" x2="354" y2="181" stroke="#2c4257" stroke-width="2.4" stroke-dasharray="8 4" />
  <text x="362" y="185" class="t-b">GOE (원자핵 공명준위)</text>
  <line x1="328" y1="202" x2="354" y2="202" stroke="#78716c" stroke-width="2.2" stroke-dasharray="5 4" />
  <text x="362" y="206" class="t-b">Poisson (완전 독립)</text>

  <!-- Right Panel: Milestones -->
  <rect x="540" y="82" width="312" height="348" rx="12" class="panel-teal" />
  <text x="560" y="108" class="t-m">B. 수치 검증 및 이론 이정표</text>
  <text x="560" y="128" class="t-h">1972~2024년 핵심 돌파 기록</text>

  <line x1="572" y1="150" x2="572" y2="395" stroke="#1f514c" stroke-width="2" />

  <circle cx="572" cy="162" r="5" fill="#1f514c" />
  <text x="586" y="166" class="t-m">1972–73 · Montgomery &amp; Dyson</text>
  <text x="586" y="183" class="t-b">쌍상관 공식 = GUE 고유값 통계 발견</text>

  <circle cx="572" cy="214" r="5" fill="#2c4257" />
  <text x="586" y="218" class="t-slate">1982–84 · NDE &amp; BGS 추측</text>
  <text x="586" y="235" class="t-b">1,726개 핵 공명(GOE) &amp; 양자혼돈 보편성</text>

  <circle cx="572" cy="266" r="5" fill="#1f514c" />
  <text x="586" y="270" class="t-m">1987–2001 · Andrew Odlyzko</text>
  <text x="586" y="287" class="t-b">10^20 및 10^22번째 영역 영점 GUE 검증</text>

  <circle cx="572" cy="318" r="5" fill="#1f514c" />
  <text x="586" y="322" class="t-m">2021 · Platt &amp; Trudgian</text>
  <text x="586" y="339" class="t-b">높이 t = 3x10^12 (약 12조 개) 전수 확인</text>

  <circle cx="572" cy="370" r="5" fill="#b45309" />
  <text x="586" y="374" class="t-w">2024 · Guth &amp; Maynard</text>
  <text x="586" y="391" class="t-b">84년 만에 잉엄(1940) 영점 밀도 한계 돌파</text>

  <text x="32" y="458" class="t-sub">도표는 Wigner(1955), Dyson(1962), Platt-Trudgian(2021), Guth-Maynard(2024, arXiv:2405.20552)를 바탕으로 직접 작도했다.</text>

