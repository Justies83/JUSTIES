<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<rect width="1000" height="380" fill="#f7f5ef"/>
<text x="40" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">각자의 요구 — 오슬로에서 확인된 입장</text>
<rect x="40" y="60" width="280" height="240" fill="#dbeafe" rx="10"/>
<text x="60" y="95" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e40af">우크라이나</text>
<text x="60" y="130" font-family="sans-serif" font-size="16" fill="#222">· 에너지 휴전 즉시 지지</text>
<text x="60" y="160" font-family="sans-serif" font-size="16" fill="#222">· 상호 중단 조건으로</text>
<text x="60" y="185" font-family="sans-serif" font-size="16" fill="#222">  러시아 정유시설 공격 중단</text>
<text x="60" y="215" font-family="sans-serif" font-size="16" fill="#222">· 정상회담 요구,</text>
<text x="60" y="240" font-family="sans-serif" font-size="16" fill="#222">  협상 테이블 참여 요구</text>
<rect x="360" y="60" width="280" height="240" fill="#dcfce7" rx="10"/>
<text x="380" y="95" font-family="sans-serif" font-size="19" font-weight="bold" fill="#166534">미국</text>
<text x="380" y="130" font-family="sans-serif" font-size="16" fill="#222">· 푸틴에 수정 평화안 제시</text>
<text x="380" y="160" font-family="sans-serif" font-size="16" fill="#222">· 안보보장·전후 경제계획·</text>
<text x="380" y="185" font-family="sans-serif" font-size="16" fill="#222">  유럽 안보 틀 논의</text>
<text x="380" y="215" font-family="sans-serif" font-size="16" fill="#222">· 러시아 디젤 정유소 공격</text>
<text x="380" y="240" font-family="sans-serif" font-size="16" fill="#222">  중단 요구</text>
<rect x="680" y="60" width="280" height="240" fill="#fee2e2" rx="10"/>
<text x="700" y="95" font-family="sans-serif" font-size="19" font-weight="bold" fill="#991b1b">러시아</text>
<text x="700" y="130" font-family="sans-serif" font-size="16" fill="#222">· 에너지 휴전 거부</text>
<text x="700" y="160" font-family="sans-serif" font-size="16" fill="#222">  (젤렌스키 주장)</text>
<text x="700" y="190" font-family="sans-serif" font-size="16" fill="#222">· 수정안에 대한 푸틴의</text>
<text x="700" y="215" font-family="sans-serif" font-size="16" fill="#222">  답변 아직 나오지 않음</text>
<text x="700" y="245" font-family="sans-serif" font-size="16" fill="#222">· 디젤 공급 거래 배경</text>
<text x="40" y="330" font-family="sans-serif" font-size="14" fill="#777">도표는 로이터·악시오스·유나이티드24·헤럴드비즈니스(2026.10.20~21) 보도 내용을 인용해 직접 작성했습니다.</text>
</svg>
