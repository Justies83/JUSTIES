<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="운항 중단 주말 타임라인">
  <rect x="0" y="0" width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#20231f">운항 중단 주말 — 금요일 멈춤에서 토요일 밤 충돌까지</text>
  <line x1="120" y1="90" x2="120" y2="450" stroke="#16756a" stroke-width="3"/>
  <circle cx="120" cy="130" r="10" fill="#16756a"/>
  <text x="150" y="124" font-family="sans-serif" font-size="20" font-weight="bold" fill="#20231f">11월 13일 금요일 오후</text>
  <text x="150" y="152" font-family="sans-serif" font-size="18" fill="#62655d">FAA 전국 운항 중단 약 5시간 · 취소 9,200편 · 지연 7,500편</text>
  <circle cx="120" cy="220" r="10" fill="#16756a"/>
