<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="호르무즈 11월 4일 업데이트">
<rect width="800" height="320" fill="#0f2a3d"/>
<text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">호르무즈 11월 4일 업데이트 — 선거 뒤 첫 대답은 이란 쪽에서</text>
<line x1="60" y1="80" x2="60" y2="270" stroke="#f2b705" stroke-width="3"/>
<circle cx="60" cy="100" r="8" fill="#f2b705"/><text x="84" y="96" fill="#ffffff" font-size="17" font-weight="700">레자이 (화요일) · 미국의 답변은 설득력 부족</text><text x="84" y="120" fill="#cfe3ef" font-size="15">조건 충족 전에는 해협 재개 없음 · 봉쇄 해제, 제재 면제, 휴전 요구</text>
<circle cx="60" cy="160" r="8" fill="#f2b705"/><text x="84" y="156" fill="#ffffff" font-size="17" font-weight="700">칼리바프 (화요일) · 공은 미국 코트에</text><text x="84" y="180" fill="#cfe3ef" font-size="15">단단하고 이성적인 답 전달 · 최고 방어 태세 유지 경고</text>
<circle cx="60" cy="220" r="8" fill="#f2b705"/><text x="84" y="216" fill="#ffffff" font-size="17" font-weight="700">엘시시 · 대화와 합의 촉구, 추가 확전 경고</text><text x="84" y="240" fill="#cfe3ef" font-size="15">중동 동맹들은 전면전 재개 반대 · 트럼프의 선거 이후 선택이 다음 분기점</text>
<text x="40" y="300" fill="#8fb3c7" font-size="13">출처: AP통신 11월 4일 보도 (마닐라 타임스, NDTV 게재)</text>
