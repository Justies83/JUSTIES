<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img">
  <defs>
    <style>
      .bg { fill: #f8f7f4; }
      .panel { fill: #ffffff; stroke: #d8d4ca; stroke-width: 1.5; }
      .panel-teal { fill: #ebf2f0; stroke: #1f514c; stroke-width: 1.5; }
      .panel-slate { fill: #eef2f6; stroke: #2c4257; stroke-width: 1.5; }
      .panel-warn { fill: #fdf6ee; stroke: #d99b52; stroke-width: 1.5; }
      .t-title { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #171717; }
      .t-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #57534e; letter-spacing: 1.0px; }
      .t-h { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 700; fill: #171717; }
      .t-b { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 12px; fill: #44403c; }
      .t-s { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 11px; fill: #57534e; }
      .t-m { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #1f514c; font-weight: 700; }
      .t-w { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #b45309; font-weight: 700; }
      .t-slate { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #2c4257; font-weight: 700; }
      .grid { stroke: #ebe7de; stroke-width: 1; }
      .axis { stroke: #78716c; stroke-width: 1.3; }
      .arrow { stroke: #1f514c; stroke-width: 2; fill: none; marker-end: url(#arr-t); }
      .arrow-s { stroke: #2c4257; stroke-width: 2; fill: none; marker-end: url(#arr-s); }
      .arrow-w { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#arr-w); }
    </style>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f514c" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2c4257" />
    </marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>
  <rect class="bg" width="880" height="480" />

  <text x="32" y="34" class="t-sub">FRACTAL DIMENSION &amp; UNIVERSAL SCALING · MANDELBROT · LORENZ · WBE · SDSS</text>
  <text x="32" y="60" class="t-title">정수 차원(1D·2D·3D)을 뚫는 프랙탈 차원과 생물 대사·우주 거대구조의 경계</text>

  <!-- Left Panel: Fractal Dimension Comparison -->
  <rect x="28" y="82" width="496" height="348" rx="12" class="panel" />
  <text x="48" y="108" class="t-h">A. 수학·혼돈·천체 프랙탈 차원(D) 비교</text>
  <line x1="173.4" y1="138" x2="173.4" y2="405" class="grid" />
  <line x1="296.9" y1="138" x2="296.9" y2="405" class="grid" />
  <line x1="420.3" y1="138" x2="420.3" y2="405" stroke="#a8a29e" stroke-dasharray="3 3" />
  <text x="173.4" y="132" text-anchor="middle" class="t-sub">1D (선)</text>
  <text x="296.9" y="132" text-anchor="middle" class="t-sub">2D (면)</text>
  <text x="420.3" y="132" text-anchor="middle" class="t-sub">3D (균질 공간)</text>
  <text x="50" y="152" class="t-b" font-weight="700">코흐 눈송이 경계 (log 4 / log 3)</text><text x="508" y="152" text-anchor="end" class="t-s">유클리드 1D 선 초과</text><rect x="50" y="158" width="155.8" height="17" rx="4" fill="#1f514c" /><text x="212.8" y="170" class="t-m" fill="#1f514c">D ≈ 1.26</text><text x="50" y="196" class="t-b" font-weight="700">영국 서해안선 (Mandelbrot 1967)</text><text x="508" y="196" text-anchor="end" class="t-s">자 크기에 따라 발산</text><rect x="50" y="202" width="154.3" height="17" rx="4" fill="#2c4257" /><text x="211.3" y="214" class="t-m" fill="#2c4257">D ≈ 1.25</text><text x="50" y="240" class="t-b" font-weight="700">시에르핀스키 삼각형 (log 3 / log 2)</text><text x="508" y="240" text-anchor="end" class="t-s">면적을 파고드는 다공성</text><rect x="50" y="246" width="195.6" height="17" rx="4" fill="#1f514c" /><text x="252.6" y="258" class="t-m" fill="#1f514c">D ≈ 1.58</text><text x="50" y="284" class="t-b" font-weight="700">망델브로 집합 경계 (Shishikura 1998)</text><text x="508" y="284" text-anchor="end" class="t-s">1D 곡선이 2D 면적 채움</text><rect x="50" y="290" width="246.9" height="17" rx="4" fill="#b45309" /><text x="303.9" y="302" class="t-m" fill="#b45309">D ≈ 2.00</text><text x="50" y="328" class="t-b" font-weight="700">로렌츠 혼돈 끌개 (Lorenz 1963, D_KY)</text><text x="508" y="328" text-anchor="end" class="t-s">3D 위상공간 비접촉 접힘</text><rect x="50" y="334" width="254.3" height="17" rx="4" fill="#b45309" /><text x="311.3" y="346" class="t-m" fill="#b45309">D ≈ 2.06</text><text x="50" y="372" class="t-b" font-weight="700">은하 분포 >70 h⁻¹ Mpc (Hogg 2005 SDSS)</text><text x="508" y="372" text-anchor="end" class="t-s">대규모 균질(3D) 수렴</text><rect x="50" y="378" width="370.3" height="17" rx="4" fill="#57534e" /><text x="427.3" y="390" class="t-m" fill="#57534e">D ≈ 3.00</text>

  <!-- Right Panel: WBE Biological Scaling + Cosmic Cutoff -->
  <rect x="540" y="82" width="312" height="348" rx="12" class="panel-teal" />
  <text x="560" y="108" class="t-m">B. 자연은 왜 프랙탈을 쓰고, 어디서 멈추나</text>

  <rect x="560" y="128" width="272" height="132" rx="8" fill="#ffffff" stroke="#1f514c" />
  <text x="574" y="150" class="t-h">1. 생명의 '제4의 차원' (WBE 1997)</text>
  <text x="574" y="170" class="t-b">• 구체의 표면적 법칙이면 대사율 ∝ M^(2/3)</text>
  <text x="574" y="188" class="t-b">• 실제 동물 대사율은 질량의 M^(3/4)에 비례</text>
  <text x="574" y="206" class="t-b">• 폐·혈관·식물 물관이 공간 충전 프랙탈로</text>
  <text x="574" y="224" class="t-b">  분지해 모세혈관 크기를 불변으로 유지하며</text>
  <text x="574" y="242" class="t-m">  실효 표면적을 1차원 더 확장한 결과</text>

  <rect x="560" y="274" width="272" height="138" rx="8" fill="#fdf6ee" stroke="#d99b52" />
  <text x="574" y="296" class="t-h">2. 무한하지 않은 자연·우주 프랙탈</text>
  <text x="574" y="316" class="t-b">• 생물 분지는 모세혈관/기공에서 멈춤(유한)</text>
  <text x="574" y="334" class="t-b">• 우주 거대구조도 작은 규모선 필라멘트지만</text>
  <text x="574" y="352" class="t-b">  SDSS 밝은 적색 은하(LRG) 관측 결과</text>
  <text x="574" y="370" class="t-w">  약 70~100 h⁻¹ Mpc 이상서 균질(3D) 복귀</text>
  <text x="574" y="392" class="t-s">※ 혼돈(Feigenbaum δ ≈ 4.669)도 보편 상수로 전이</text>

  <text x="32" y="458" class="t-sub">도표는 Mandelbrot(1967), Lorenz(1963), West-Brown-Enquist(1997), Shishikura(1998), Hogg et al.(2005)를 바탕으로 작성했다.</text>

</svg>
