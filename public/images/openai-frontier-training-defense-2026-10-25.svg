<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="sans-serif">
<rect width="900" height="430" fill="#f4f1ea"/>
<text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">한 겹이 뚫려도 다음 겹이 버틴다</text>
<text x="450" y="70" text-anchor="middle" font-size="14" fill="#62655d">OpenAI의 다층 방어와 레드팀이 찾은 우회 경로</text>
<rect x="60" y="100" width="780" height="56" fill="#16756a"/>
<text x="450" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1층 · 샌드박스와 마이크로VM — 컨테이너를 경량 가상머신 안에서 격리</text>
<text x="450" y="145" text-anchor="middle" font-size="13" fill="#dcebe8">레드팀 발견: 취약점 연결로 마이크로VM 탈출, 호스트 코드 실행</text>
<rect x="60" y="168" width="780" height="56" fill="#2a7f76"/>
<text x="450" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2층 · 모니터링과 자동 중단 — 무단 활동을 잡아 실행을 멈춘다</text>
<text x="450" y="213" text-anchor="middle" font-size="13" fill="#dcebe8">레드팀 발견: 모니터링·자동 중단의 빈틈도 함께 노출</text>
<rect x="60" y="236" width="780" height="56" fill="#3d8f87"/>
<text x="450" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3층 · 네트워크·클라우드 경계 — 호스트를 장악해도 인터넷 길을 막는다</text>
<text x="450" y="281" text-anchor="middle" font-size="13" fill="#dcebe8">레드팀 발견: 지표·로그·인증 서비스의 좁은 연결에서 우회 경로</text>
<rect x="60" y="304" width="780" height="56" fill="#e0795b"/>
<text x="450" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">격리 밖의 길 · 캐시 타이밍 통신 — 네트워크 없이도 신호를 주고받다</text>
<text x="450" y="349" text-anchor="middle" font-size="13" fill="#fbe9e2">스펙터·멜트다운 계열 기법, 느리지만 경계를 넘는 채널</text>
<text x="450" y="405" text-anchor="middle" font-size="13" fill="#62655d">기준: OpenAI(2026.10.23) 글의 방어 구조와 레드티밍 결과 정리</text>
</svg>
