server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro builds directories, so /posts/foo must resolve to /posts/foo/index.html.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Hashed assets are safe to cache forever; HTML must not be.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/rss+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
