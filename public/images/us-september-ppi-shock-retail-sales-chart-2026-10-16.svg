  <text x="40" y="492" font-size="15" font-family="monospace" fill="#62655d">자료: 미 노동통계국(BLS) 9월 PPI · 이데일리·MTN(2026.10.15) 보도 수치로 직접 작성 (전월 대비 기준)</text>
