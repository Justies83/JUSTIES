  <text x="90.0" y="145.5" class="t-s">푸아송(무작위): s→0에서 뭉침</text>
  <text x="246.8" y="150.0" text-anchor="middle" class="t-m">GUE (리만 영점): ~ s^2 반발</text>
  <text x="199.2" y="273.6" class="t-slate">GOE (원자핵): ~ s 반발</text>

  <!-- Legend -->
