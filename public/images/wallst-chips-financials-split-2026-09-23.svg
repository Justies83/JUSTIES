  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">전 거래일 대비 등락률(%) · 중앙선 기준 좌우로 표시</text>

