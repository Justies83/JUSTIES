name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches a malformed front matter block before it reaches the host.
      - run: npx astro check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.pages.dev' }}
