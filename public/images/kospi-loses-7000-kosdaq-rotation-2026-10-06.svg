<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="10월 6일 코스피 코스닥 마감 도표. 코스피는 0.89퍼센트 내린 6941.39로 7000선을 다시 내줬다. 외국인이 1조7509억원을 순매도했고 삼성전자는 1.45퍼센트, SK하이닉스는 3.69퍼센트 내렸다. 코스닥은 2.98퍼센트 올라 919.92로 마감했다. 반도체에서 2차전지 바이오 소부장으로 수급이 이동했다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">SEOUL CLOSE — OCT 6</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">코스피 7000선 다시 내줬다</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">외국인 1.7조 던지는 사이 코스닥은 3% 뛰었다</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <text x="80" y="154" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">코스피</text>
  <rect x="220" y="142" width="53" height="20" fill="#e0795b" opacity="0.6"/>
  <text x="283" y="156" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#e0795b">-0.89% (6,941.39)</text>

  <text x="80" y="186" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">코스닥</text>
  <rect x="220" y="174" width="179" height="20" fill="#16756a" opacity="0.65"/>
  <text x="409" y="188" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#16756a">+2.98% (919.92)</text>

  <line x1="60" y1="212" x2="840" y2="212" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="224" width="360" height="106" fill="#e0795b" opacity="0.14"/>
  <text x="76" y="248" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">외국인 순매도 1조7,509억원</text>
  <text x="76" y="272" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">삼성전자 -1.45% (27만2,000원)</text>
  <text x="76" y="292" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">SK하이닉스 -3.69% (177만3,000원)</text>
  <text x="76" y="312" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">HBM 차익실현 매물 집중</text>

  <rect x="480" y="224" width="360" height="106" fill="#16756a" opacity="0.14"/>
  <text x="496" y="248" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">반도체 → 2차전지·바이오·소부장</text>
  <text x="496" y="272" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">삼성전기 +5.95%</text>
  <text x="496" y="292" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">주성엔지니어링 +17.5%</text>
  <text x="496" y="312" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">수급 이동에 따른 순환매 장세</text>

  <line x1="60" y1="350" x2="840" y2="350" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="362" width="780" height="76" fill="#62655d" opacity="0.1"/>
  <text x="76" y="386" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">시장 분위기 — "다음 이벤트를 기다리는 모습"</text>
  <text x="76" y="406" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">연휴 기간 해외발 호재에도 매크로 경계심리로 관망세</text>
  <text x="76" y="426" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">10/8 삼성전자 3분기 잠정실적 — 영업이익 100조원 돌파 여부 주목</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 비즈니스코리아·머니투데이·뉴스핌 보도로 직접 작성</text>
</svg>
