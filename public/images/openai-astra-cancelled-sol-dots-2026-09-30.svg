  <text x="76" y="428" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">목표만 제시하면 조사·분석·문서 작성까지 스스로 처리 (GPT-6 아스트라 기반)</text>
  <text x="76" y="448" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">4,000개+ 앱 연동 · 클라우드 컴퓨터·브라우저 상시 가동</text>
  <text x="76" y="468" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#16756a">추가 안전장치 — 권한 범위·승인 필요 작업을 사용자가 맞춤 규칙으로 통제</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 ZDNet Korea·이투데이·TechCrunch 보도로 직접 작성</text>
