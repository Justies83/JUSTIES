  <text x="74" y="468" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#20231f">공모가 상단($78) + 사모배정($26.0B)을 합하면 최대 <tspan font-family="'IBM Plex Mono',ui-monospace,monospace">$90.4B</tspan> — 그린슈(1억 2,375만 주)까지 더하면 공모분만 <tspan font-family="'IBM Plex Mono',ui-monospace,monospace">$74.0B</tspan></text>
  <text x="74" y="496" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">Anthropic S-1/A(2026.11.10) 수치로 직접 계산·작성 · 사모배정은 공모와 별도 계약, 인수수수료 없음</text>
