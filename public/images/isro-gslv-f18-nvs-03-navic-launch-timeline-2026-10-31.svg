<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">NVS 시리즈, 20개월 공백 끝에 이어지다</text>
  <line x1="60" y1="190" x2="740" y2="190" stroke="#cccccc" stroke-width="2"/>
  <g font-size="15" fill="#1a1a1a" font-weight="bold">
    <text x="110" y="150" text-anchor="middle">2023년 5월</text>
    <text x="300" y="150" text-anchor="middle">2025년 1월</text>
    <text x="490" y="150" text-anchor="middle">2026년 10월 30일</text>
    <text x="690" y="150" text-anchor="middle">앞으로 수일</text>
  </g>
  <g font-size="14" fill="#555555">
    <text x="110" y="225" text-anchor="middle">NVS-01 발사</text>
    <text x="110" y="247" text-anchor="middle">2세대 1호기</text>
    <text x="300" y="225" text-anchor="middle">NVS-02 발사</text>
    <text x="300" y="247" text-anchor="middle">궤도 상승 실패</text>
    <text x="490" y="225" text-anchor="middle">NVS-03 발사 성공</text>
    <text x="490" y="247" text-anchor="middle">GSLV-F18, 20번째 비행</text>
    <text x="690" y="225" text-anchor="middle">궤도 상승</text>
    <text x="690" y="247" text-anchor="middle">동경 32.5도 슬롯</text>
  </g>
  <g>
    <circle cx="110" cy="190" r="10" fill="#2e86c1"/>
    <circle cx="300" cy="190" r="10" fill="#c0392b"/>
    <circle cx="490" cy="190" r="10" fill="#1e8449"/>
    <circle cx="690" cy="190" r="10" fill="#ffffff" stroke="#888888" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" fill="#888888">
    <text x="400" y="310" text-anchor="middle">NVS-01과 NVS-02 사이 19개월, NVS-02와 NVS-03 사이 약 20개월의 간격이 있었다.</text>
    <text x="400" y="332" text-anchor="middle">궤도 상승과 점검을 마쳐야 NVS-03이 실제 항법 서비스에 들어간다.</text>
  </g>
  <text x="400" y="362" text-anchor="middle" font-size="13" fill="#888888">출처: 더힌두·뉴인디안익스프레스 2026년 10월 30일~31일 보도.</text>
</svg>
