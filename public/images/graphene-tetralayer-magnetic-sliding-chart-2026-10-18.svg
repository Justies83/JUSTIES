<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="버널 적층에서 롬보헤드럴 적층으로 전압이 층을 밀어 자성을 전환하는 개념도">
<rect width="900" height="520" fill="#f4f1ea"/>
<text x="450" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#20231f">전압으로 층을 밀면 자성이 켜졌다 꺼진다</text>
<text x="450" y="72" text-anchor="middle" font-size="15" fill="#62655d">4층 그래핀 · Nature Nanotechnology (2026-10-14)</text>

<!-- Bernal panel -->
<text x="225" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#16756a">버널(Bernal) 적층</text>
<text x="225" y="134" text-anchor="middle" font-size="14" fill="#62655d">가장 안정 · 가장 흔함</text>
<g>
<rect x="95" y="155" width="260" height="26" rx="6" fill="#16756a" opacity="0.85"/>
<rect x="119" y="205" width="260" height="26" rx="6" fill="#16756a" opacity="0.85"/>
<rect x="95" y="255" width="260" height="26" rx="6" fill="#16756a" opacity="0.85"/>
<rect x="119" y="305" width="260" height="26" rx="6" fill="#16756a" opacity="0.85"/>
<text x="80" y="174" text-anchor="end" font-size="14" fill="#20231f">A</text>
<text x="104" y="224" text-anchor="end" font-size="14" fill="#20231f">B</text>
<text x="80" y="274" text-anchor="end" font-size="14" fill="#20231f">A</text>
<text x="104" y="324" text-anchor="end" font-size="14" fill="#20231f">B</text>
</g>
<rect x="120" y="348" width="210" height="36" rx="18" fill="#20231f"/>
<text x="225" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#f4f1ea">비자성</text>

<!-- arrow -->
<line x1="400" y1="240" x2="500" y2="240" stroke="#20231f" stroke-width="3"/>
<polygon points="500,240 484,231 484,249" fill="#20231f"/>
<polygon points="400,240 416,231 416,249" fill="#20231f"/>
<text x="450" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#20231f">게이트 전압으로</text>
<text x="450" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#20231f">층 밀기 (sliding)</text>

<!-- Rhombohedral panel -->
<text x="675" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#e0795b">롬보헤드럴(rhombohedral) 적층</text>
<text x="675" y="134" text-anchor="middle" font-size="14" fill="#62655d">덜 안정 · 드묾</text>
<g>
<rect x="545" y="155" width="260" height="26" rx="6" fill="#e0795b" opacity="0.9"/>
<rect x="561" y="205" width="260" height="26" rx="6" fill="#e0795b" opacity="0.9"/>
<rect x="577" y="255" width="260" height="26" rx="6" fill="#e0795b" opacity="0.9"/>
<rect x="593" y="305" width="260" height="26" rx="6" fill="#e0795b" opacity="0.9"/>
<text x="530" y="174" text-anchor="end" font-size="14" fill="#20231f">A</text>
<text x="546" y="224" text-anchor="end" font-size="14" fill="#20231f">B</text>
<text x="562" y="274" text-anchor="end" font-size="14" fill="#20231f">C</text>
<text x="578" y="324" text-anchor="end" font-size="14" fill="#20231f">A</text>
</g>
<rect x="570" y="348" width="210" height="36" rx="18" fill="#e0795b"/>
<text x="675" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#f4f1ea">자성 (강자성)</text>

<!-- bottom band -->
<rect x="60" y="408" width="780" height="66" rx="10" fill="#20231f" opacity="0.92"/>
<text x="450" y="436" text-anchor="middle" font-size="16" font-weight="bold" fill="#f4f1ea">비휘발성 — 전압을 끊어도 상태가 유지된다</text>
<text x="450" y="460" text-anchor="middle" font-size="13" fill="#f4f1ea" opacity="0.85">원자를 물리적으로 움직인 기록이라 믿을 수 있는 메모리 원천 · 전기적으로 다시 쓰는 양자 물질</text>

<text x="450" y="502" text-anchor="middle" font-size="11" fill="#62655d" font-family="monospace">Cornell 보도자료 · Nature Nanotechnology (2026-10-14) 설명을 바탕으로 직접 작성</text>
</svg>
