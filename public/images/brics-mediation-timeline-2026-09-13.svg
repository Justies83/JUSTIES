<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="9월 초 우크라이나 종전 협상을 둘러싼 타임라인. 9월 9일 크렘린이 3자 협상 재개 가능성을 언급했고, 9월 12일 새벽 러시아가 오데사 등지에 드론과 미사일 공습을 가했으며, 9월 11일부터 13일 사이 브릭스 정상회의에서 시진핑과 모디가 푸틴에게 중재를 제안했다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">TIMELINE — SEP 9~13</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">외교적 중재 제안과 공습이 같은 한 주에 겹쳤다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">우크라이나 종전 협상을 둘러싼 최근 흐름</text>

  <!-- timeline axis -->
  <line x1="80" y1="280" x2="820" y2="280" stroke="rgba(32,35,31,.2)" stroke-width="2"/>

  <!-- 9.9 diplomacy -->
  <text x="160" y="160" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">크렘린 "3자 협상</text>
  <text x="160" y="180" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">재개 가능" 언급</text>
  <text x="160" y="222" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#16756a">9.9</text>
  <circle cx="160" cy="280" r="7" fill="#16756a"/>
  <text x="160" y="312" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">외교</text>

  <!-- 9.12 dawn military -->
  <text x="420" y="160" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">오데사 등 드론</text>
  <text x="420" y="180" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">129대 공습</text>
  <text x="420" y="222" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#e0795b">9.12</text>
  <circle cx="420" cy="280" r="7" fill="#e0795b"/>
  <text x="420" y="312" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">군사</text>

  <!-- 9.11 Modi meeting -->
  <text x="600" y="170" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">푸틴·모디 면담</text>
  <text x="600" y="222" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#16756a">9.11</text>
  <circle cx="600" cy="280" r="7" fill="#16756a"/>
  <text x="600" y="312" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">외교</text>

  <!-- 9.13 Xi/Modi mediation offer -->
  <text x="760" y="160" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">시진핑·모디</text>
  <text x="760" y="180" text-anchor="middle" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">중재 제안 공개</text>
  <text x="760" y="222" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14.5" fill="#16756a">9.13</text>
  <circle cx="760" cy="280" r="8" fill="#16756a"/>
  <text x="760" y="312" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">외교 · 브릭스</text>

  <line x1="60" y1="440" x2="840" y2="440" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="466" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">젤렌스키는 12월 마이애미 G20 회동을 원하지만 러시아는 모스크바를 고집</text>
  <text x="60" y="488" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 경향신문·헤럴드경제·키이우인디펜던트 보도로 직접 작성</text>
</svg>
