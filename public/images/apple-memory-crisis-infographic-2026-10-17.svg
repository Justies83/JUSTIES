<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">메모리 품귀의 두 개의 숫자</text>

  <!-- Left panel: HBM share of DRAM capacity -->
  <text x="230" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#333333">D램 생산능력에서 HBM 비중 (KB증권)</text>
  <rect x="40" y="100" width="380" height="330" fill="#f6f7f9" rx="10"/>

  <g>
    <text x="140" y="180" text-anchor="middle" font-size="15" fill="#555555">2025년</text>
    <rect x="110" y="195" width="60" height="175" fill="#c9d6e8"/>
    <rect x="110" y="370" width="60" height="0" fill="#ffffff"/>
    <text x="140" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">27%</text>

    <text x="320" y="180" text-anchor="middle" font-size="15" fill="#555555">2027년 전망</text>
    <rect x="290" y="120" width="60" height="250" fill="#b3543f"/>
    <text x="320" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">40%</text>

    <text x="230" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#b3543f">+13%p</text>
    <path d="M 175 300 L 285 270" stroke="#b3543f" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b3543f" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Right panel: smartphone shipments -->
  <text x="670" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#333333">3분기 세계 스마트폰 출하량 (옴디아 잠정)</text>
  <rect x="480" y="100" width="380" height="330" fill="#f6f7f9" rx="10"/>

  <g>
    <text x="580" y="180" text-anchor="middle" font-size="15" fill="#555555">전년 동기</text>
    <rect x="550" y="195" width="60" height="175" fill="#c9d6e8"/>
    <text x="580" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">기준</text>

    <text x="760" y="180" text-anchor="middle" font-size="15" fill="#555555">2026년 3분기</text>
    <rect x="730" y="236" width="60" height="134" fill="#4a6fa5"/>
    <text x="760" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#b3543f">-20%</text>

    <path d="M 615 250 L 725 280" stroke="#b3543f" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <text x="450" y="470" text-anchor="middle" font-size="14" fill="#777777">수익성 좋은 HBM·서버용 D램으로 생산이 쏠리면서 일반 모바일용 메모리가 씨가 말랐다</text>
  <text x="450" y="496" text-anchor="middle" font-size="12" fill="#999999">출처: KB증권·옴디아 (2026.10.17 매일경제 보도 인용) — 직접 작성 도표</text>
</svg>
