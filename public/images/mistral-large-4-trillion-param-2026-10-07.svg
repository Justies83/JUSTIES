<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="미스트랄 라지 4 도표. 총 1조 파라미터, 활성 파라미터 490억의 네이티브 멀티모달 모델로 엔비디아 그레이스 블랙웰 GPU 3800장으로 학습했다. 코딩 DeepSWE v1.1에서 61.7%, 취약점 재현 테스트에서 82%, 사이버벤치에서 93%를 기록했다. 시각 인지 테스트 Dense 200에서는 미스트랄이 42%로 GPT-6 아스트라의 41%를 근소하게 앞섰다. API는 공개 당일 미리보기가 열렸고 전체 가중치는 10월 말 공개된다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">MISTRAL AI — OCT 6</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">프랑스발 1조 파라미터 모델</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">미스트랄 라지 4, 일부 벤치마크서 美 빅테크 앞섰다</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="132" width="230" height="52" fill="#62655d" opacity="0.1"/>
  <text x="76" y="154" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">총 파라미터</text>
  <text x="76" y="174" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#16756a">1조 (활성 490억)</text>

  <rect x="310" y="132" width="230" height="52" fill="#62655d" opacity="0.1"/>
  <text x="326" y="154" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">학습 인프라</text>
  <text x="326" y="174" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#16756a">GB 3,800장 · 유럽</text>

  <rect x="560" y="132" width="280" height="52" fill="#62655d" opacity="0.1"/>
  <text x="576" y="154" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">공개 일정</text>
  <text x="576" y="174" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#16756a">API 즉시 · 가중치 10월 말</text>

  <line x1="60" y1="202" x2="840" y2="202" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="226" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">벤치마크 성적 (%)</text>

  <text x="60" y="250" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#20231f">코딩 — DeepSWE v1.1</text>
  <rect x="220" y="238" width="395" height="16" fill="#16756a" opacity="0.65"/>
  <text x="625" y="251" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#16756a">61.7%</text>

  <text x="60" y="276" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#20231f">보안 — 취약점 재현</text>
  <rect x="220" y="264" width="525" height="16" fill="#16756a" opacity="0.65"/>
  <text x="755" y="277" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#16756a">82%</text>

  <text x="60" y="302" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#20231f">보안 — 사이버벤치</text>
  <rect x="220" y="290" width="595" height="16" fill="#16756a" opacity="0.65"/>
  <text x="825" y="303" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#16756a">93%</text>

  <line x1="60" y1="328" x2="840" y2="328" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="350" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">시각 인지 — Dense 200 (%)</text>

  <text x="60" y="374" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#20231f">미스트랄 라지 4</text>
  <rect x="220" y="362" width="269" height="16" fill="#e0795b" opacity="0.65"/>
  <text x="497" y="375" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#e0795b">42%</text>

  <text x="60" y="400" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">GPT-6 아스트라</text>
  <rect x="220" y="388" width="262" height="16" fill="#62655d" opacity="0.3"/>
  <text x="490" y="401" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">41%</text>

  <line x1="60" y1="426" x2="840" y2="426" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="450" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#62655d">API 가격 — 입력 100만 토큰당 1.36달러 · 출력 100만 토큰당 4.18달러</text>
  <text x="60" y="472" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">수치는 모두 미스트랄 자체 발표 기준, 제3자 재현 결과는 아직 없음</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 Mistral AI 발표 자료로 직접 작성</text>
</svg>
