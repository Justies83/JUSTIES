<text x="135" y="126" text-anchor="end" font-size="15" fill="#62655d" font-family="monospace">Kp 5</text>
<text x="306" y="112" text-anchor="start" font-size="17" fill="#20231f" font-family="sans-serif">고위도 전력망 약한 변동 · 오로라 미시간·메인</text>
<rect x="150" y="150" width="280" height="52" rx="6" fill="#16756a" opacity="0.92"/>
<text x="135" y="172" text-anchor="end" font-size="20" font-weight="700" fill="#20231f" font-family="sans-serif">G2 중간</text>
<text x="135" y="196" text-anchor="end" font-size="15" fill="#62655d" font-family="monospace">Kp 6</text>
<text x="446" y="182" text-anchor="start" font-size="17" font-weight="700" fill="#20231f" font-family="sans-serif">★ 10월 11일 예보 — 고위도 전압 경보 · 오로라 뉴욕·아이다호</text>
<rect x="150" y="220" width="420" height="52" rx="6" fill="#e0795b" opacity="0.75"/>
<text x="135" y="242" text-anchor="end" font-size="20" font-weight="700" fill="#20231f" font-family="sans-serif">G3 강함</text>
<text x="135" y="266" text-anchor="end" font-size="15" fill="#62655d" font-family="monospace">Kp 7</text>
<text x="586" y="252" text-anchor="start" font-size="17" fill="#20231f" font-family="sans-serif">전압 보정 필요 · 오로라 일리노이·오리건 (주말 중 소폭 가능성)</text>
