<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="한미 대미투자 협상 원전 지분율 쟁점 도표. 미국에 지을 대형 원전 8기 중 6기는 웨스팅하우스 AP1000, 2기는 한국형 APR1400이다. 한국은 웨스팅하우스 투자시 15에서 20퍼센트 지분과 이사회 참여를 요구하고 미국은 의결권 없는 5에서 10퍼센트 소수 지분만 허용하려 한다. 국회 보고는 21에서 22일, 발표는 23일이 유력하다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">KR-US INVESTMENT — SEP 19</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">걸린 건 지분율 — 15% 대 5%</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">대형 원전 8기 지분 쟁점과 국회 보고 일정</text>

  <line x1="60" y1="132" x2="840" y2="132" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="156" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">원전 8기 구성</text>
  <g font-family="'IBM Plex Sans KR',sans-serif" font-size="14">
    <text x="60" y="182" fill="#20231f">웨스팅하우스 AP1000</text>
    <text x="290" y="182" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#20231f">6기</text>
    <text x="60" y="208" fill="#20231f">한국형 APR1400</text>
    <text x="290" y="208" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#e0795b">2기 — 美 정부·웨스팅하우스 난색</text>
  </g>

  <line x1="60" y1="232" x2="840" y2="232" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="256" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">지분율 쟁점 — 웨스팅하우스 투자 몫</text>

  <g font-family="'IBM Plex Sans KR',sans-serif" font-size="14">
    <text x="60" y="284" fill="#20231f">한국 요구</text>
    <rect x="200" y="270" width="240" height="22" fill="#16756a" opacity="0.7"/>
    <text x="450" y="286" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#16756a">15~20% + 이사회 참여(의결권)</text>

    <text x="60" y="316" fill="#20231f">미국 제시</text>
    <rect x="200" y="302" width="80" height="22" fill="#e0795b" opacity="0.7"/>
    <text x="290" y="318" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#e0795b">5~10% (의결권 없음)</text>
  </g>

  <line x1="60" y1="340" x2="840" y2="340" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="352" width="780" height="40" fill="#e0795b" opacity="0.15"/>
  <text x="76" y="377" font-family="'IBM Plex Sans KR',sans-serif" font-size="14" fill="#20231f">동시에 걸린 요구 — 연간 한도 200억달러 중 100억달러 안팎 연말까지 현금 송금</text>

  <line x1="60" y1="410" x2="840" y2="410" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="434" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">일정 — 화살표는 시간 축</text>
  <line x1="80" y1="472" x2="820" y2="472" stroke="rgba(32,35,31,.3)" stroke-width="2" marker-end="url(#arrow5)"/>
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(32,35,31,.3)"/>
    </marker>
  </defs>
  <text x="160" y="460" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#62655d">9.17 보고 취소</text>
  <text x="470" y="460" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#20231f">9.21~22 보고 예상</text>
  <text x="770" y="460" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#e0795b">9.23 발표 유력</text>

  <text x="60" y="500" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 헤럴드경제·이투데이·뉴스핌 보도로 직접 작성</text>
</svg>
