<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#f4f1ea"/>
<text x="450" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#20231f">안보리 표결, 두 결의안 모두 부결</text>
<text x="450" y="82" text-anchor="middle" font-size="17" fill="#62655d">2026년 10월 30일 유엔 안전보장이사회 · 채택에는 찬성 9표 이상과 상임이사국 거부권 없음이 필요</text>

<rect x="60" y="110" width="370" height="330" rx="12" fill="#ffffff" stroke="#16756a" stroke-width="3"/>
<text x="245" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#16756a">미국 초안 S/2026/868</text>
<text x="245" y="180" text-anchor="middle" font-size="15" fill="#62655d">1년 연장 · 명칭 MINUSO로 변경</text>
<text x="245" y="205" text-anchor="middle" font-size="15" fill="#62655d">자치안을 유일한 협상 토대로 못 박음</text>
<text x="245" y="270" text-anchor="middle" font-size="52" font-weight="700" fill="#16756a">11 - 1 - 3</text>
<text x="245" y="305" text-anchor="middle" font-size="17" fill="#20231f">찬성 11 · 반대 1 · 기권 3</text>
<text x="245" y="340" text-anchor="middle" font-size="17" fill="#20231f">러시아 거부권 행사로 부결</text>
<text x="245" y="375" text-anchor="middle" font-size="15" fill="#62655d">기권: 중국 · 파키스탄 · 소말리아</text>
<text x="245" y="405" text-anchor="middle" font-size="15" fill="#62655d">프랑스 · 영국 등 11개국 찬성</text>

<rect x="470" y="110" width="370" height="330" rx="12" fill="#ffffff" stroke="#e0795b" stroke-width="3"/>
<text x="655" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#e0795b">러시아 초안 S/2026/870</text>
<text x="655" y="180" text-anchor="middle" font-size="15" fill="#62655d">기존 위임 그대로 1년 연장</text>
<text x="655" y="205" text-anchor="middle" font-size="15" fill="#62655d">명칭 · 기능 · 구조 변경 없음</text>
<text x="655" y="270" text-anchor="middle" font-size="52" font-weight="700" fill="#e0795b">3 - 1 - 11</text>
<text x="655" y="305" text-anchor="middle" font-size="17" fill="#20231f">찬성 3 · 반대 1 · 기권 11</text>
<text x="655" y="340" text-anchor="middle" font-size="17" fill="#20231f">미국 거부권 행사 · 9표 미달로 부결</text>
<text x="655" y="375" text-anchor="middle" font-size="15" fill="#62655d">찬성: 중국 · 소말리아 · 러시아</text>
<text x="655" y="405" text-anchor="middle" font-size="15" fill="#62655d">결과: 위임 2026년 10월 31일 만료</text>

<text x="450" y="485" text-anchor="middle" font-size="14" fill="#62655d" font-family="monospace">출처: 유엔 회의 보도자료 SC/16498 (2026.10.30) · 로이터 2026년 10월 30일 보도 / 직접 작성</text>
</svg>
