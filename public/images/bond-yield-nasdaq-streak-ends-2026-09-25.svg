<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="9월 23일 뉴욕증시 도표. 마이클 바 연준 이사의 10월 추가 금리인상 발언에 10년물 국채금리가 5.102퍼센트로 19년 만에 최고치를 기록했다. 나스닥은 1.13퍼센트 내려 이틀 연속 이어온 사상 최고치 행진을 멈췄다. 반도체주 낙폭은 샌디스크 3.73퍼센트, SK하이닉스 ADR 3.12퍼센트, 마이크론 2.22퍼센트, 엔비디아 1.47퍼센트, 필라델피아반도체지수 1.23퍼센트 순이다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">BOND YIELD SHOCK — SEP 23</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">금리가 19년 최고치, 반도체가 먼저 흔들렸다</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">3대 지수 낙폭 및 국채금리</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

