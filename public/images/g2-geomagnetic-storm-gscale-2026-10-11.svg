<text x="135" y="336" text-anchor="end" font-size="15" fill="#62655d" font-family="monospace">Kp 8</text>
<text x="726" y="322" text-anchor="start" font-size="17" fill="#20231f" font-family="sans-serif">광범위한 전압 제어 문제 · 오로라 앨라배마·북캘리포니아</text>
<rect x="150" y="360" width="700" height="52" rx="6" fill="#c0392b" opacity="0.92"/>
<text x="135" y="382" text-anchor="end" font-size="20" font-weight="700" fill="#20231f" font-family="sans-serif">G5 극심함</text>
<text x="135" y="406" text-anchor="end" font-size="15" fill="#62655d" font-family="monospace">Kp 9</text>
<text x="866" y="392" text-anchor="end" font-size="17" fill="#ffffff" font-family="sans-serif">전력망 붕괴 가능 · 오로라 플로리다·남텍사스</text>
<text x="450" y="470" text-anchor="middle" font-size="14" fill="#62655d" font-family="monospace">NOAA SWPC G-scale 기준 · 오로라 가시 남한계는 보도된 예보 수치 · 도표 직접 작성 (2026.10)</text>
