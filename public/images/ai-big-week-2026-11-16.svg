  <text x="74" y="430" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#20231f">엔비디아 실적은 한국시간 11월 18일 새벽에 확인된다.</text>

  <text x="74" y="492" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">연합뉴스 2026년 11월 16일 보도 내용을 바탕으로 직접 작성</text>
