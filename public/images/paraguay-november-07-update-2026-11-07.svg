<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#f4f1ea"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#20231f">파면 뒤의 숫자</text>
  <g>
    <rect x="40" y="60" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="215" y="112" text-anchor="middle" font-size="34" font-weight="bold" fill="#16756a">44-0</text>
    <text x="215" y="142" text-anchor="middle" font-size="14" fill="#20231f">상원 파면 표결</text>
    <text x="215" y="164" text-anchor="middle" font-size="12" fill="#62655d">출석 의원 44명 전원 찬성, 1명 결석</text>
    <rect x="410" y="60" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="585" y="112" text-anchor="middle" font-size="34" font-weight="bold" fill="#16756a">3건</text>
    <text x="585" y="142" text-anchor="middle" font-size="14" fill="#20231f">페냐 등 대상 형사 사건</text>
    <text x="585" y="164" text-anchor="middle" font-size="12" fill="#62655d">배임 · 영향력 행사 · 공금 유용</text>
    <rect x="40" y="210" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="215" y="262" text-anchor="middle" font-size="34" font-weight="bold" fill="#e0795b">27명</text>
    <text x="215" y="292" text-anchor="middle" font-size="14" fill="#20231f">기소된 인원</text>
    <text x="215" y="314" text-anchor="middle" font-size="12" fill="#62655d">우에노 대주주 바스케스 포함, 이사 6명 구금</text>
    <rect x="410" y="210" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="585" y="262" text-anchor="middle" font-size="34" font-weight="bold" fill="#e0795b">2028년 8월</text>
    <text x="585" y="292" text-anchor="middle" font-size="14" fill="#20231f">아야나 대통령 임기 종료</text>
    <text x="585" y="314" text-anchor="middle" font-size="12" fill="#62655d">페냐의 남은 임기 이어받아 수행</text>
  </g>
  <text x="400" y="378" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: AP통신, CNN 보도 수치 (2026.11.07)</text>
</svg>
