<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="340" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">스페이스X, 로켓에서 AI 인프라로 — 최근과 앞으로의 일정</text>
  <line x1="60" y1="150" x2="740" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="110" cy="150" r="9" fill="#16756a"/>
  <text x="110" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#20231f">2026년 6월 12일</text>
  <text x="110" y="130" text-anchor="middle" font-size="12" fill="#666">상장</text>
  <text x="110" y="185" text-anchor="middle" font-size="12" fill="#20231f">첫 분기 흑자까지</text>
  <text x="110" y="203" text-anchor="middle" font-size="12" fill="#20231f">이어진 분기</text>
  <circle cx="290" cy="150" r="9" fill="#16756a"/>
  <text x="290" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#20231f">2026년 9월 28일</text>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#666">스타십 14호기 첫 궤도 비행</text>
  <text x="290" y="185" text-anchor="middle" font-size="12" fill="#20231f">스타링크 V3 위성 26기 전개</text>
  <circle cx="470" cy="150" r="9" fill="#e0795b"/>
  <text x="470" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#20231f">2026년 10월 20일</text>
  <text x="470" y="130" text-anchor="middle" font-size="12" fill="#666">3분기 실적 발표</text>
  <text x="470" y="185" text-anchor="middle" font-size="12" fill="#20231f">매출 145억 8천만 달러</text>
  <text x="470" y="203" text-anchor="middle" font-size="12" fill="#20231f">순이익 44억 달러</text>
  <circle cx="650" cy="150" r="9" fill="#3b82f6"/>
  <text x="650" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#20231f">2026년 11월 · 2027년</text>
