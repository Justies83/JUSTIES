  <text x="169.8" y="177.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#16756a">$57.75B</text>
  <text x="169.8" y="448" text-anchor="middle" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#62655d">공모가 $70</text>
  <rect x="306.3" y="175.8" width="110" height="244.2" fill="#16756a" rx="3"/>
  <text x="361.3" y="163.8" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#16756a">$61.05B</text>
  <text x="361.3" y="448" text-anchor="middle" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#62655d">공모가 $74</text>
