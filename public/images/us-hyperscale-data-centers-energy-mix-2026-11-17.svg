  <text x="764" y="169" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" fill="#e0795b">54%</text>

  <text x="74" y="241" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#20231f">재생에너지</text>
