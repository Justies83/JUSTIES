<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">호르무즈, 공격의 주말과 외교의 월요일</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#62655d">10월 30일~11월 2일 · 로이터, UKMTO 경보, 나킬랏 성명 기준</text>
  <line x1="80" y1="110" x2="80" y2="470" stroke="#20231f" stroke-width="2"/>
  <circle cx="80" cy="130" r="8" fill="#e0795b"/>
  <text x="105" y="126" font-size="16" font-weight="bold" fill="#20231f">10월 30일 저녁 — 알 마예다 피격</text>
  <text x="105" y="150" font-size="14" fill="#62655d">카타르 LNG선, 정체불명 물체에 맞음 · 선원 무사, 운항 지속</text>
  <circle cx="80" cy="195" r="8" fill="#e0795b"/>
  <text x="105" y="191" font-size="16" font-weight="bold" fill="#20231f">10월 30일 — 루이즈 1호·아르자나 피격</text>
  <text x="105" y="215" font-size="14" fill="#62655d">림펫 기뢰·투사체 공격 · 인도 선원 포함 전원 무사</text>
  <circle cx="80" cy="260" r="8" fill="#16756a"/>
  <text x="105" y="256" font-size="16" font-weight="bold" fill="#20231f">11월 1일 15:09 UTC — UKMTO 경보 191호</text>
  <text x="105" y="280" font-size="14" fill="#62655d">호르무즈 안 선박 투사체 피격 신고 중계 · 선박명 미확인</text>
  <circle cx="80" cy="325" r="8" fill="#b3543f"/>
  <text x="105" y="321" font-size="16" font-weight="bold" fill="#20231f">11월 1일 — 혁명수비대, 유조선 2척 기뢰 폭발 주장</text>
  <text x="105" y="345" font-size="14" fill="#62655d">선박명 없음 · 독립 확인 안 됨 · 주장과 사실 구분 필요</text>
  <circle cx="80" cy="390" r="8" fill="#16756a"/>
  <text x="105" y="386" font-size="16" font-weight="bold" fill="#20231f">11월 1일 23:47 UTC — UKMTO 경보 192호</text>
  <text x="105" y="410" font-size="14" fill="#62655d">걸프 북부 유조선 투사체 2발 피격 · 선원 전원 확인</text>
  <circle cx="80" cy="455" r="8" fill="#20231f"/>
  <text x="105" y="451" font-size="16" font-weight="bold" fill="#20231f">11월 2일 — 브렌트유 7.94% 하락, 104.43달러</text>
  <text x="105" y="475" font-size="14" fill="#62655d">48시간 재개안 기대가 공격 소식의 충격을 앞지름</text>
</svg>
