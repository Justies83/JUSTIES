<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <style>
      .bg { fill: #f8f7f4; }
      .panel { fill: #ffffff; stroke: #d8d4ca; stroke-width: 1.5; }
      .panel-teal { fill: #ebf2f0; stroke: #1f514c; stroke-width: 1.5; }
      .panel-warn { fill: #fdf6ee; stroke: #d99b52; stroke-width: 1.5; }
      .t-title { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #171717; }
      .t-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #57534e; letter-spacing: 1.1px; }
      .t-h { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 700; fill: #171717; }
      .t-b { font-family: 'Pretendard Variable', 'IBM Plex Sans KR', sans-serif; font-size: 12px; fill: #44403c; }
      .t-m { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #1f514c; font-weight: 700; }
      .t-w { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #b45309; font-weight: 700; }
      .arrow { stroke: #1f514c; stroke-width: 2; fill: none; marker-end: url(#arr-t); }
    </style>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f514c" />
    </marker>
  </defs>

  <rect class="bg" width="880" height="460" />
  <text x="32" y="34" class="t-sub">CRISPR TOOLING WORKFLOW · TKOV3 (71,090 GUIDES) → PX459 (BBSI GOLDEN GATE)</text>
  <text x="32" y="60" class="t-title">TKOv3 가이드 → PX459 올리고 자동 설계 및 두 가지 오류 차단 흐름</text>

  <rect x="28" y="84" width="248" height="156" rx="12" class="panel" />
  <text x="46" y="110" class="t-m">STEP 01 · 유전자 매칭</text>
  <text x="46" y="132" class="t-h">HGNC 이전 이름까지 탐색</text>
  <text x="46" y="156" class="t-b">• 2016년 TKOv3 심볼과</text>
  <text x="46" y="174" class="t-b">  이전 이름 41,267건 매칭</text>
  <text x="46" y="194" class="t-b">• 예: MLL → KMT2A 자동 연결</text>
  <text x="46" y="214" class="t-b">• 유전자당 검증 가이드 4개 추출</text>

  <path d="M 282 162 L 308 162" class="arrow" />

  <rect x="314" y="84" width="256" height="156" rx="12" class="panel-teal" />
  <text x="332" y="110" class="t-m">STEP 02 · 5' G 자동 판별</text>
  <text x="332" y="132" class="t-h">U6 프로모터 개시 염기 규칙</text>
  <text x="332" y="156" class="t-b">• G로 시작: CACC + 20nt (24-mer)</text>
  <text x="332" y="176" class="t-b">• 비-G 시작: CACC+G+20nt (25-mer)</text>
  <text x="332" y="196" class="t-b">• 역상보 R 말단 짝 C 자동 동기화</text>
  <text x="332" y="216" class="t-b">• 21 nt 변형·누락 실수 원천 차단</text>

  <path d="M 576 162 L 602 162" class="arrow" />

  <rect x="608" y="84" width="244" height="156" rx="12" class="panel-warn" />
  <text x="626" y="110" class="t-w">STEP 03 · BBSI 충돌 검사</text>
  <text x="626" y="132" class="t-h">내부 제한효소 재절단 방지</text>
  <text x="626" y="156" class="t-b">• GAAGAC / GTCTTC 양방향 스캔</text>
  <text x="626" y="176" class="t-b">• 충돌 시 클로닝 불가 태그 표시</text>
  <text x="626" y="196" class="t-b">• 꼭 필요할 땐 BsmBI 벡터 안내</text>
  <text x="626" y="216" class="t-b">• 2주 뒤 시퀀싱 실패 비용 예방</text>

  <!-- Bottom privacy & CSV strip -->
  <rect x="28" y="264" width="824" height="148" rx="12" class="panel" />
  <text x="48" y="294" class="t-m">OUTPUT &amp; PRIVACY DESIGN</text>
  <text x="48" y="318" class="t-h">브라우저 로컬 연산 (외부 서버 전송 0) &amp; 이원화 CSV 내보내기</text>
  <text x="48" y="346" class="t-b">1. 주문용 CSV (Name, Sequence) — 합성 업체 양식에 즉시 붙여넣기 (UTF-8 BOM 지원)</text>
  <text x="48" y="368" class="t-b">2. 랩노트 보관 CSV — 엑손 · hg19/GRCh37 좌표 · GC% · +G 여부 · BbsI 검사 · 라이브러리 출처 주석 기록</text>
  <text x="48" y="390" class="t-b">3. 단일 HTML &amp; DecompressionStream 브라우저 내 처리 → 비공개 표적 유전자 정보 외부 유출 없음</text>

  <text x="32" y="440" class="t-sub">도표는 JUSTIES Lab Tool (/tools/tkov3-oligo-designer) 설계 기준과 TKOv3·Ran et al. 규칙으로 작성했다.</text>
</svg>
