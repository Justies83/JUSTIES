<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">무라수 저녁 집계 — 사망 2명, 피해액 344크로르 루피</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#62655d">11월 3일 저녁 더 힌두·데칸 헤럴드(PTI) 보도 기준 · 시각은 인도 표준시</text>
  <text x="120" y="125" font-size="17" fill="#20231f">사망 2명 — 바팟라 지구에서 건물 붕괴로 숨져</text>
  <rect x="120" y="138" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="138" width="180" height="34" fill="#a33b2e"/>
  <text x="120" y="215" font-size="17" fill="#20231f">농작물 피해 52,459헥타르 · 15개 지구 · 132개 만달</text>
  <rect x="120" y="228" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="228" width="520" height="34" fill="#e0795b"/>
  <text x="120" y="305" font-size="17" fill="#20231f">주택 312채 · 전신주 2,750개 · 대피소 12,230명</text>
  <rect x="120" y="318" width="600" height="34" fill="#e5e0d5"/>
  <rect x="120" y="318" width="420" height="34" fill="#16756a"/>
  <text x="120" y="395" font-size="17" fill="#20231f">최고 강수 마리팔렘 263.75mm · 열차 35편 이상 취소</text>
  <text x="450" y="455" text-anchor="middle" font-size="14" fill="#62655d">정오 사이클론 단계로 약화, 밤에는 깊은 저기압으로 · 북서쪽 텔랑가나 방향</text>
  <text x="450" y="482" text-anchor="middle" font-size="14" fill="#62655d">다음 관전 포인트는 내륙의 비, 전력 복구, 보상 집계</text>
</svg>
