  <text x="60" y="492" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">막대 길이는 하락률(%)에 비례</text>
  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 파이낸셜뉴스·글로벌이코노믹 보도로 직접 작성</text>
