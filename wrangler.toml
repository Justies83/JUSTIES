# Cloudflare Workers deployment for the site itself.
#
# The dashboard's "import a repository" flow creates a Worker with static
# assets, not a Pages project, and runs `wrangler deploy` on every push. Without
# this file that deploy takes platform defaults, and two of them are wrong here:
#
#   * html_handling defaulted to auto-trailing-slash, so every internal link
#     (which carries no trailing slash) cost a 307 redirect.
#   * not_found_handling defaulted to none, so a bad URL returned a bare 404
#     instead of the site's own 404 page.
#
# `name` must keep matching the existing Worker, or a deploy creates a second
# one at a different address.

name = "justies"
main = "gate/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
# Only the editor and the private archive go through the password gate. Every
# public page is served straight from the asset store, so the script never
# touches that traffic. Keep this in step with PROTECTED in gate/index.js.
run_worker_first = ["/admin", "/admin/*", "/private", "/private/*"]

# The custom domain. Cloudflare creates the DNS record and the certificate from
# this route, so the domain only has to sit in the same account — nothing needs
# to be clicked in the dashboard. workers.dev stays alive alongside it, which is
# what keeps the old address working while search engines pick up the new one.
[[routes]]
pattern = "justies.net"
custom_domain = true

# ADMIN_PASSWORD is NOT stored here.
#   npx wrangler secret put ADMIN_PASSWORD
