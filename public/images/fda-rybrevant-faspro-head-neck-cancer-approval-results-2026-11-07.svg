<rect width="900" height="380" fill="#faf8f3"/>
<text x="40" y="40" font-size="22" font-weight="bold" fill="#222">OrigAMI-4 코호트 1 — 라이브레반트 패스프로 단독요법 (102명)</text>
<text x="40" y="66" font-size="14" fill="#666">FDA와 존슨앤드존슨 2026-11-05 발표 기준. 맹검 독립 중앙 판독(RECIST v1.1).</text>
<text x="40" y="112" font-size="16" fill="#222">전체 반응률</text>
<rect x="230" y="94" width="350" height="26" fill="#16756a"/>
<text x="590" y="114" font-size="16" font-weight="bold" fill="#222">42%</text>
<text x="40" y="152" font-size="16" fill="#222">완전 반응</text>
<rect x="230" y="134" width="125" height="26" fill="#16756a"/>
<text x="365" y="154" font-size="16" font-weight="bold" fill="#222">15%</text>
<text x="40" y="192" font-size="16" fill="#222">부분 반응</text>
