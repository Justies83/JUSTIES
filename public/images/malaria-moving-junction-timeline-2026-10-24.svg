<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="말라리아 침입 문 연구 연표">
  <rect width="1000" height="300" fill="#fdf8f0"/>
  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">말라리아 침입 문, 150년 가까운 연구 연표</text>
  <line x1="60" y1="150" x2="940" y2="150" stroke="#999" stroke-width="3"/>
  <g font-size="17" fill="#1a1a1a" text-anchor="middle">
    <circle cx="110" cy="150" r="10" fill="#c0392b"/>
    <text x="110" y="105" font-weight="bold">1880년</text>
    <text x="110" y="195">라브랑, 혈액에서</text>
    <text x="110" y="218">플라스모디움 발견</text>
    <circle cx="370" cy="150" r="10" fill="#b7791f"/>
    <text x="370" y="105" font-weight="bold">1970년대</text>
    <text x="370" y="195">전자현미경으로 막</text>
    <text x="370" y="218">두꺼워짐 관찰</text>
    <circle cx="640" cy="150" r="10" fill="#2563eb"/>
    <text x="640" y="105" font-weight="bold">2026년 6월</text>
    <text x="640" y="195">Cell 논문: 접합부</text>
    <text x="640" y="218">구조 규명</text>
    <circle cx="890" cy="150" r="10" fill="#15803d"/>
    <text x="890" y="105" font-weight="bold">2026년 10월 23일</text>
    <text x="890" y="195">콴타 해설로</text>
    <text x="890" y="218">그림이 널리 알려짐</text>
  </g>
  <text x="500" y="272" text-anchor="middle" font-size="14" fill="#888">출처: 콴타 매거진 해설(2026.10.23)과 Cell 논문 정보를 바탕으로 작성</text>
</svg>
