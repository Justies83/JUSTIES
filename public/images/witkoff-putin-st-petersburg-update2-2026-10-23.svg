<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="sans-serif">
  <rect width="860" height="320" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">10월 23일 업데이트 — 푸틴 본인 확인과 밤의 공습</text>
  <line x1="60" y1="150" x2="800" y2="150" stroke="#999" stroke-width="2"/>
  <circle cx="120" cy="150" r="10" fill="#d73a49"/>
  <circle cx="330" cy="150" r="10" fill="#1f6feb"/>
  <circle cx="540" cy="150" r="10" fill="#6a737d"/>
  <circle cx="740" cy="150" r="10" fill="#d73a49"/>
  <text x="120" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">푸틴 TV 인터뷰</text>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#333">다음 달 3자 협상 재개 준비</text>
  <text x="120" y="185" text-anchor="middle" font-size="13" fill="#333">목표는 최종 평화합의,</text>
  <text x="120" y="205" text-anchor="middle" font-size="13" fill="#333">단기 휴전 아님</text>
  <text x="330" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">영토 입장</text>
  <text x="330" y="122" text-anchor="middle" font-size="13" fill="#333">돈바스는 역사적 러시아 땅</text>
  <text x="330" y="185" text-anchor="middle" font-size="13" fill="#333">우크라이나는 보유 땅 양보 거부,</text>
  <text x="330" y="205" text-anchor="middle" font-size="13" fill="#333">간극 그대로</text>
  <text x="540" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">밤의 공습</text>
  <text x="540" y="122" text-anchor="middle" font-size="13" fill="#333">키이우에 21발, 3차례</text>
  <text x="540" y="185" text-anchor="middle" font-size="13" fill="#333">그중 3발 집속탄 주장,</text>
  <text x="540" y="205" text-anchor="middle" font-size="13" fill="#333">모스크바에 630대 드론</text>
  <text x="740" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">다음 판</text>
  <text x="740" y="122" text-anchor="middle" font-size="13" fill="#333">유해 교환 252 대 25</text>
  <text x="740" y="185" text-anchor="middle" font-size="13" fill="#333">EU 11월 26일에서 27일,</text>
  <text x="740" y="205" text-anchor="middle" font-size="13" fill="#333">700억 유로 논의</text>
  <text x="430" y="280" text-anchor="middle" font-size="13" fill="#666">일정표는 좁혀졌고, 내용의 간극은 그대로 — 날짜보다 의제가 먼저다</text>
</svg>
