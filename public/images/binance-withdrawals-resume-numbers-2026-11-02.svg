<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="sans-serif">
  <rect width="900" height="440" fill="#f4f1ea"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#20231f">바이낸스 출금 재개 첫 9시간 반, 돈은 얼마나 움직였나</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#62655d">11월 1일 오전 6시부터 오후 3시 30분까지 (UTC) · 바이낸스 발표 기준</text>
  <text x="120" y="140" font-size="17" fill="#20231f">출금: 46억5,000만 달러</text>
  <rect x="120" y="155" width="600" height="42" fill="#e5e0d5"/>
  <rect x="120" y="155" width="600" height="42" fill="#e0795b"/>
  <text x="120" y="255" font-size="17" fill="#20231f">입금: 10억1,000만 달러</text>
  <rect x="120" y="270" width="600" height="42" fill="#e5e0d5"/>
  <rect x="120" y="270" width="130" height="42" fill="#16756a"/>
  <text x="450" y="365" text-anchor="middle" font-size="20" font-weight="bold" fill="#20231f">순유출 36억4,000만 달러 = 전체 운용자산 1,710억 달러의 2.1%</text>
  <text x="450" y="400" text-anchor="middle" font-size="14" fill="#62655d">출처: 바이낸스 발표 (로이터·AFP 보도, 2026.11.02)</text>
</svg>
