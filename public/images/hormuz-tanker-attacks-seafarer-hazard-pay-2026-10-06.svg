<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="호르무즈 해협 유조선 피격 도표. UKMTO에 따르면 9월 28일 이후 선박 7척이 공격받았고 최근 2주로 넓히면 9척이 피격당해 선원 1명이 숨지고 2명이 다쳤다. 왕복 위험수당은 최대 2만5천달러까지 올랐다. 브렌트유는 배럴당 102.25달러이며 연말까지 100달러 선을 유지할 전망이다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">STRAIT OF HORMUZ — OCT 6</text>
  <text x="60" y="76" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16.5" fill="#20231f">왕복 한 번에 위험수당 3,400만원</text>
  <text x="60" y="100" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#62655d">최근 2주, 유조선 9척이 공격받았다</text>

  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="138" width="243" height="100" fill="#e0795b" opacity="0.16"/>
  <text x="76" y="162" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">피격 선박 (2주)</text>
  <text x="76" y="190" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="19" fill="#e0795b">9척</text>
  <text x="76" y="212" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">9/28 이후 UKMTO 집계 7척</text>

  <rect x="313" y="138" width="243" height="100" fill="#62655d" opacity="0.1"/>
  <text x="329" y="162" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">인명 피해</text>
  <text x="329" y="190" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="19" fill="#20231f">사망 1 · 부상 2</text>
  <text x="329" y="212" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">10/4 파나마 유조선 추가 피격</text>

  <rect x="566" y="138" width="274" height="100" fill="#16756a" opacity="0.14"/>
  <text x="582" y="162" font-family="'IBM Plex Sans KR',sans-serif" font-size="13.5" fill="#20231f">왕복 위험수당</text>
  <text x="582" y="190" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#16756a">최대 $25,000</text>
  <text x="582" y="212" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">약 3,400만원 — 1년치 임금 넘기도</text>

  <line x1="60" y1="256" x2="840" y2="256" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="280" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">항해 중 겪는 일</text>

  <rect x="60" y="292" width="780" height="34" fill="#62655d" opacity="0.08"/>
  <text x="76" y="315" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">야간엔 불을 끄고 창문을 닫은 채 해협 통과</text>

  <rect x="60" y="330" width="780" height="34" fill="#62655d" opacity="0.08"/>
  <text x="76" y="353" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">GPS 신호 끊김 — 전통적 레이더 항법에 의존</text>

  <rect x="60" y="368" width="780" height="34" fill="#e0795b" opacity="0.18"/>
  <text x="76" y="391" font-family="'IBM Plex Sans KR',sans-serif" font-size="12.5" fill="#20231f">선원 증언 — "드론은 예상했지만 미사일 공격까지는 생각 못했다"</text>

  <line x1="60" y1="406" x2="840" y2="406" stroke="rgba(32,35,31,.12)"/>

  <rect x="60" y="418" width="780" height="74" fill="#16756a" opacity="0.1"/>
  <text x="76" y="442" font-family="'IBM Plex Sans KR',sans-serif" font-size="13" fill="#20231f">브렌트유 배럴당 102.25달러</text>
  <text x="76" y="462" font-family="'IBM Plex Sans KR',sans-serif" font-size="12" fill="#62655d">캐피털 이코노믹스 — "연말까지 100달러 선 유지 전망"</text>
  <text x="76" y="482" font-family="'IBM Plex Sans KR',sans-serif" font-size="11.5" fill="#62655d">공격은 모두 해협 가장 좁은 구간 부근에서 발생</text>

  <text x="60" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">도표는 글로벌이코노믹·서울경제·뉴스핌 보도로 직접 작성</text>
</svg>
