<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#f4f1ea"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#20231f">사태의 숫자</text>
  <g>
    <rect x="40" y="60" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="215" y="112" text-anchor="middle" font-size="34" font-weight="bold" fill="#16756a">약 300만 명</text>
    <text x="215" y="142" text-anchor="middle" font-size="14" fill="#20231f">돈에 손 못 댄 우에노 예금자</text>
    <text x="215" y="164" text-anchor="middle" font-size="12" fill="#62655d">인구 650만 명의 절반 가까이</text>
    <rect x="410" y="60" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="585" y="112" text-anchor="middle" font-size="34" font-weight="bold" fill="#16756a">8억 달러</text>
    <text x="585" y="142" text-anchor="middle" font-size="14" fill="#20231f">우에노에 묶인 공공예금</text>
    <text x="585" y="164" text-anchor="middle" font-size="12" fill="#62655d">전체 예금의 약 4분의 1 (AP통신)</text>
    <rect x="40" y="210" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="215" y="262" text-anchor="middle" font-size="34" font-weight="bold" fill="#e0795b">78-0</text>
    <text x="215" y="292" text-anchor="middle" font-size="14" fill="#20231f">하원 탄핵 소추 표결</text>
    <text x="215" y="314" text-anchor="middle" font-size="12" fill="#62655d">참석 의원 전원 찬성, 반대 0표</text>
    <rect x="410" y="210" width="350" height="130" fill="#ffffff" stroke="#d8d2c4"/>
    <text x="585" y="262" text-anchor="middle" font-size="34" font-weight="bold" fill="#e0795b">5%</text>
    <text x="585" y="292" text-anchor="middle" font-size="14" fill="#20231f">하루 새 떨어진 과라니 가치</text>
    <text x="585" y="314" text-anchor="middle" font-size="12" fill="#62655d">달러당 6,500선 돌파 후 6,490 마감</text>
  </g>
  <text x="400" y="378" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: AP통신, 로이터 보도 수치 (2026.11.05~06)</text>
</svg>
