<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#f4f1ea"/>
<text x="40" y="48" font-size="26" font-weight="bold" fill="#20231f">앤트로픽 매출, 3년 만에 400배 가까이</text>
<text x="40" y="78" font-size="15" fill="#62655d">연 매출 기준. 2026년은 상반기 수치만으로 이미 2025년 한 해의 3.5배</text>
<line x1="80" y1="430" x2="840" y2="430" stroke="#20231f" stroke-width="3"/>
<rect x="140" y="428" width="110" height="2" fill="#16756a"/>
<text x="195" y="408" font-size="16" font-weight="bold" fill="#20231f" text-anchor="middle">4,100만 달러</text>
<text x="195" y="460" font-size="15" fill="#20231f" text-anchor="middle">2023년</text>
<rect x="330" y="422" width="110" height="8" fill="#16756a"/>
<text x="385" y="402" font-size="16" font-weight="bold" fill="#20231f" text-anchor="middle">3억 8,600만 달러</text>
<text x="385" y="460" font-size="15" fill="#20231f" text-anchor="middle">2024년</text>
<rect x="520" y="345" width="110" height="85" fill="#e0795b"/>
<text x="575" y="325" font-size="16" font-weight="bold" fill="#20231f" text-anchor="middle">45억 9,000만 달러</text>
<text x="575" y="460" font-size="15" fill="#20231f" text-anchor="middle">2025년</text>
<rect x="700" y="130" width="110" height="300" fill="#20231f"/>
<text x="755" y="110" font-size="16" font-weight="bold" fill="#20231f" text-anchor="middle">162억 9,000만 달러</text>
<text x="755" y="460" font-size="15" fill="#20231f" text-anchor="middle">2026년 상반기</text>
<text x="40" y="492" font-size="13" fill="#62655d">도표는 앤트로픽 S-1 서류 내용을 더레지스터, 쿠코인, 디크립트 2026년 10월 26일 보도를 정리해 직접 만들었다.</text>
</svg>
