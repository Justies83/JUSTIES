  <text x="60" y="488" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">막대 길이는 등락률(%)에 비례 · 중앙선 기준 오른쪽 상승(청록)·왼쪽 하락(주황)</text>
  <text x="60" y="506" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 EBN·머니투데이 보도로 직접 작성</text>
