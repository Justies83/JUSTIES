  <text x="120" y="125" font-size="17" fill="#20231f">발생 확률: B0 입자 100억 개 중 한 번</text>
  <rect x="120" y="138" width="600" height="30" fill="#e5e0d5"/>
  <rect x="120" y="138" width="120" height="30" fill="#20231f"/>
  <text x="120" y="215" font-size="17" fill="#20231f">통계 유의성: 3.2시그마 — 배경 요동 확률 1500분의 1</text>
