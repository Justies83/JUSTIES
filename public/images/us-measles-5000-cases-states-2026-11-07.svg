  <text x="400" y="352" text-anchor="middle" font-size="14" fill="#20231f">네 개 주 합계 3,104건 — 전체 확진자의 약 60%</text>
  <text x="400" y="382" text-anchor="middle" font-family="monospace" font-size="12" fill="#62655d">출처: CDC·펜실베이니아·위스콘신 보건당국 (2026.11.04~05 기준)</text>
