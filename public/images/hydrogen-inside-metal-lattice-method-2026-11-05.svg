<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="sans-serif">
  <rect width="900" height="470" fill="#f4f1ea"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">어떻게 봤나 — 중수소 바꿔치기와 극저온 측정</text>
  <g font-size="16" fill="#1a1a1a">
    <rect x="60" y="80" width="220" height="110" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="170" y="118" text-anchor="middle" font-weight="bold">1. 중수소로 표시</text>
    <text x="170" y="146" text-anchor="middle" font-size="14" fill="#555555">수소 대신 무거운 동위원소</text>
    <text x="170" y="168" text-anchor="middle" font-size="14" fill="#555555">중수소로 합금을 충전</text>
    <text x="300" y="140" font-size="26" fill="#16756a">→</text>
    <rect x="340" y="80" width="220" height="110" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="450" y="118" text-anchor="middle" font-weight="bold">2. 극저온 원자 탐침</text>
    <text x="450" y="146" text-anchor="middle" font-size="14" fill="#555555">크라이오-APT로 원자 하나씩</text>
    <text x="450" y="168" text-anchor="middle" font-size="14" fill="#555555">떼어내며 3차원 분포 재구성</text>
    <text x="580" y="140" font-size="26" fill="#16756a">→</text>
    <rect x="620" y="80" width="220" height="110" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="730" y="118" text-anchor="middle" font-weight="bold">3. 교차 검증</text>
    <text x="730" y="146" text-anchor="middle" font-size="14" fill="#555555">전자현미경과 이론 계산으로</text>
    <text x="730" y="168" text-anchor="middle" font-size="14" fill="#555555">격자 틈새 상태 확인</text>
  </g>
  <g>
    <rect x="60" y="230" width="380" height="130" rx="12" fill="#ffffff" stroke="#16756a" stroke-width="2"/>
    <text x="250" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">질량 신호로 구분</text>
    <text x="250" y="302" text-anchor="middle" font-size="16" fill="#555555">주변 수소 1달턴 / 중수소 <tspan font-weight="bold" fill="#e0795b">2달턴</tspan></text>
    <text x="250" y="330" text-anchor="middle" font-size="14" fill="#888888">1달턴 차이가 실험 수소의 증거</text>
  </g>
  <g>
    <rect x="460" y="230" width="380" height="130" rx="12" fill="#ffffff" stroke="#16756a" stroke-width="2"/>
    <text x="650" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">CoCrNiFeMn 합금 측정값</text>
    <text x="650" y="302" text-anchor="middle" font-size="16" fill="#555555">중수소 농도 <tspan font-weight="bold" fill="#e0795b">1.3원자퍼센트</tspan></text>
    <text x="650" y="330" text-anchor="middle" font-size="14" fill="#888888">무게 기준 473ppm, L12 석출상에 우선 농축</text>
  </g>
  <text x="450" y="405" text-anchor="middle" font-size="15" fill="#555555">FCC 합금은 수소 용해도가 높고 확산이 느려 측정에 유리했다</text>
  <text x="450" y="435" text-anchor="middle" font-size="13" fill="#888888">출처: Nature 2026, DOI 10.1038/s41586-026-11238-4</text>
</svg>
