  <text x="120" y="395" font-size="17" fill="#20231f">VELO 검출기, LHC 빔에서 5mm 거리 · 향후 업그레이드 10배 목표</text>
  <text x="450" y="440" text-anchor="middle" font-size="14" fill="#62655d">결과는 표준모형 예측과 일치 — 새 물리학의 증거는 아직 아니다</text>
