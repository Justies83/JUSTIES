<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#f4f1ea"/>
<text x="40" y="48" font-size="26" font-weight="bold" fill="#20231f">지표금리 교체, 어디까지 왔고 어디로 가나</text>
<text x="40" y="78" font-size="15" fill="#62655d">KOFR 확산과 코리보 퇴출 일정 — 2026년 10월 25일 관계기관 합동 발표 기준</text>
<line x1="60" y1="250" x2="840" y2="250" stroke="#20231f" stroke-width="3"/>
<circle cx="100" cy="250" r="12" fill="#16756a"/>
<circle cx="260" cy="250" r="12" fill="#16756a"/>
<circle cx="420" cy="250" r="12" fill="#e0795b"/>
<circle cx="580" cy="250" r="12" fill="#e0795b"/>
<circle cx="740" cy="250" r="12" fill="#20231f"/>
<text x="100" y="210" font-size="17" font-weight="bold" fill="#20231f" text-anchor="middle">2025년 7월</text>
<text x="100" y="300" font-size="15" fill="#20231f" text-anchor="middle">이자율스왑 1차년도</text>
<text x="100" y="324" font-size="15" fill="#20231f" text-anchor="middle">목표 10%, 실적 12.1%</text>
<text x="260" y="210" font-size="17" font-weight="bold" fill="#20231f" text-anchor="middle">2026년 3월</text>
<text x="260" y="300" font-size="15" fill="#20231f" text-anchor="middle">지표금리 개편방안</text>
<text x="260" y="324" font-size="15" fill="#20231f" text-anchor="middle">로드맵 발표</text>
<text x="420" y="210" font-size="17" font-weight="bold" fill="#20231f" text-anchor="middle">2026년 10월 26일</text>
<text x="420" y="300" font-size="15" fill="#20231f" text-anchor="middle">산은·기은 KOFR</text>
<text x="420" y="324" font-size="15" fill="#20231f" text-anchor="middle">기업대출 1조 원 출시</text>
<text x="580" y="210" font-size="17" font-weight="bold" fill="#20231f" text-anchor="middle">2027년 4월</text>
<text x="580" y="300" font-size="15" fill="#20231f" text-anchor="middle">코리보 기반 신규대출</text>
<text x="580" y="324" font-size="15" fill="#20231f" text-anchor="middle">원칙적 중단</text>
<text x="740" y="210" font-size="17" font-weight="bold" fill="#20231f" text-anchor="middle">2030년</text>
<text x="740" y="300" font-size="15" fill="#20231f" text-anchor="middle">스왑 비중 70% 이상,</text>
<text x="740" y="324" font-size="15" fill="#20231f" text-anchor="middle">CD 중요지표 지정 해제</text>
<text x="40" y="470" font-size="14" fill="#62655d">도표는 2026년 10월 25일 한국은행·금융위원회·금융감독원 합동 발표 수치를 인용해 직접 작성했습니다.</text>
</svg>
