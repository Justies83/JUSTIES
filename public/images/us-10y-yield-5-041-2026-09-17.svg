<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="9월 15일 현지시간 뉴욕증시 도표. 다우 0.63퍼센트, S&amp;P500 0.45퍼센트, 나스닥 0.78퍼센트 하락했고 필라델피아 반도체지수는 0.40퍼센트 올랐다. 미 10년물 국채금리는 장중 5.041퍼센트로 2007년 이후 최고를 기록했다.">
  <rect width="900" height="520" fill="#f4f1ea"/>
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="rgba(32,35,31,.16)"/>

  <text x="60" y="52" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="3" fill="#62655d">NY CLOSE — SEP 15 (ET)</text>
  <text x="60" y="82" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#20231f">움직인 것은 지수가 아니라 금리였다</text>
  <text x="60" y="108" font-family="'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#62655d">3대 지수 등락률과 미 10년물 국채금리</text>

  <!-- zero axis for % changes -->
  <line x1="420" y1="146" x2="420" y2="330" stroke="rgba(32,35,31,.25)"/>
  <text x="420" y="342" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#62655d">0%</text>

  <g font-family="'IBM Plex Sans KR',sans-serif" font-size="14">
    <text x="60" y="177" fill="#20231f">다우</text>
    <rect x="294" y="160" width="126" height="24" fill="#e0795b" opacity="0.75"/>
    <text x="284" y="177" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#e0795b">-0.63%</text>
    <text x="434" y="177" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">52,093.11</text>

    <text x="60" y="222" fill="#20231f">S&amp;P500</text>
    <rect x="330" y="205" width="90" height="24" fill="#e0795b" opacity="0.6"/>
    <text x="320" y="222" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#e0795b">-0.45%</text>
    <text x="434" y="222" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">7,585.73</text>

    <text x="60" y="267" fill="#20231f">나스닥</text>
    <rect x="264" y="250" width="156" height="24" fill="#e0795b"/>
    <text x="254" y="267" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#e0795b">-0.78%</text>
    <text x="434" y="267" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#62655d">25,981.57</text>

    <text x="60" y="312" fill="#20231f">필라델피아 반도체</text>
    <rect x="420" y="295" width="80" height="24" fill="#16756a" opacity="0.6"/>
    <text x="514" y="312" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" fill="#16756a">+0.40%</text>
    <text x="600" y="312" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">전날 급락서 반등</text>
  </g>

  <line x1="60" y1="364" x2="840" y2="364" stroke="rgba(32,35,31,.12)"/>

  <text x="60" y="394" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#62655d">미 10년물 국채금리 (장중 최고)</text>
  <text x="60" y="436" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="34" fill="#e0795b">5.041%</text>
  <text x="240" y="428" font-family="'IBM Plex Sans KR',sans-serif" font-size="15" fill="#20231f">2007년 서브프라임 위기 이후 최고 — 햇수로 19년</text>
  <text x="240" y="450" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">사우디 동서 송유관 폐쇄에 따른 유가 급등이 배경</text>

  <line x1="60" y1="468" x2="840" y2="468" stroke="rgba(32,35,31,.08)"/>
  <text x="60" y="488" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">FOMC 0.25%p 인상 반영 확률 보도치 약 90~94.5% · 결과는 한국시간 9.17 새벽 3시</text>
  <text x="60" y="506" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#62655d">도표는 파이낸셜뉴스·블록미디어 보도로 직접 작성</text>
</svg>
